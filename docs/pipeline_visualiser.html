f X and Y* | X \u2192 \u2026 \u2192 Z \u2190 \u2026 \u2190 Y |\n| `confounder` | *There exists at least one confounder (common cause) of X and Y* | X \u2190 \u2026 \u2190 Z \u2192 \u2026 \u2192 Y |\n\nThe parser keeps every fact tied to its premise id, and rejects self-loops (X causes X)."},{"cell":9,"kind":"code","heading":"2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)","source":"# Pick a test premise whose graph has both oriented and unoriented edges (a good teaching example)\ndef mixed(p):\n    g = pc_from_premise(parse_premise(p))\n    return len(g.nodes) <= 5 and g.directed and g.undirected\ntext = next(p for p in data[\"test\"].premise.unique() if mixed(p))\nfacts = parse_premise(text)\nprint(text, \"\\n\")\nprint(\"variables  :\", facts.variables)\nprint(\"correlated :\", sorted(\"\".join(sorted(p)) for p in facts.correlated))\nprint(\"independent:\", {\"\".join(sorted(p)): [\"{\" + \",\".join(sorted(s)) + \"}\" for s in sets]\n                       for p, sets in facts.sepsets.items() if sets})\nprint(\"\\nhypothesis :\", parse_hypothesis(\"There exists at least one collider (i.e., common effect) of A and C.\"))","snippet":{"id":"nb:9","title":"Notebook cell 9","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["# Pick a test premise whose graph has both oriented and unoriented edges (a good teaching example)","def mixed(p):","    g = pc_from_premise(parse_premise(p))","    return len(g.nodes) <= 5 and g.directed and g.undirected","text = next(p for p in data[\"test\"].premise.unique() if mixed(p))","facts = parse_premise(text)","print(text, \"\\n\")","print(\"variables  :\", facts.variables)","print(\"correlated :\", sorted(\"\".join(sorted(p)) for p in facts.correlated))","print(\"independent:\", {\"\".join(sorted(p)): [\"{\" + \",\".join(sorted(s)) + \"}\" for s in sets]","                       for p, sets in facts.sepsets.items() if sets})","print(\"\\nhypothesis :\", parse_hypothesis(\"There exists at least one collider (i.e., common effect) of A and C.\"))"],"notes":{"1":"Helper: does this premise make a graph with BOTH proven arrows and undecided (dashed) edges?","2":"Read the premise, then run the PC algorithm on it.","3":"Keep it small (\u2264 5 variables) and require both edge types.","4":"Take the first test premise that passes the check.","5":"Stage 1: sentences \u2192 Premise object (variables, correlated pairs, sepsets).","7":"The variable names from the header sentence.","8":"Pairs the text says are correlated, written as 'AC' etc.","9":"For each pair: every set of variables that makes the pair independent ({} = no condition).","11":"Parse one example hypothesis into Hypothesis(relation, x, y)."},"summary":"Stage 1 demo: pick a teaching premise and show the facts the regex reader extracts from it."}},{"cell":10,"kind":"markdown","heading":"2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)","source":"How much of each test set can the rules read?"},{"cell":11,"kind":"code","heading":"2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)","source":"coverage = {name: df.hypothesis.map(lambda h: parse_hypothesis(h) is not None).mean()\n            for name, df in data.items() if name != \"train\"}\npd.Series(coverage, name=\"hypotheses parsed\").map(\"{:.0%}\".format).to_frame()","snippet":{"id":"nb:11","title":"Notebook cell 11","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["coverage = {name: df.hypothesis.map(lambda h: parse_hypothesis(h) is not None).mean()","            for name, df in data.items() if name != \"train\"}","pd.Series(coverage, name=\"hypotheses parsed\").map(\"{:.0%}\".format).to_frame()"],"notes":{"0":"For each set: share of hypotheses where parse_hypothesis returns something (not None).","1":"Skip train (it is all template text anyway).","2":"Show as percentages. Paraphrase = 0%: the reader knows none of the new wordings."},"summary":"How much text can the regex reader understand in each test set?"}},{"cell":12,"kind":"markdown","heading":"2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)","source":"The rules read 100 % of the template text \u2014 including renamed variables \u2014 but **0 %** of the\nparaphrased hypotheses. Hand-written patterns do not generalise to new wording.\nThis is the gap Phase 2 (DistilBERT) is meant to close."},{"cell":13,"kind":"markdown","heading":"3. Stage 2 \u2014 Facts \u2192 causal graph (PC algorithm)","source":"## 3. Stage 2 \u2014 Facts \u2192 causal graph (PC algorithm)\n\nThe PC algorithm (Spirtes & Glymour; builds on Pearl's d-separation) turns a list of\n(in)dependences into a graph in three steps:\n\n1. **Skeleton** \u2014 join X and Y if *no* set of other variables makes them independent.\n2. **V-structures** \u2014 for X \u2013 Z \u2013 Y with X, Y not joined: if Z is in none of X, Y's separating sets,\n   then Z is a common effect: X \u2192 Z \u2190 Y. (Conditioning on a common effect creates dependence.)\n3. **Meek rules** \u2014 orient more edges where the other direction would create a cycle or a new v-structure.\n\nThe result is a **PDAG**: some edges have a known direction, others (dashed) cannot be oriented from\ncorrelations alone. A PDAG stands for a small set of **equivalent DAGs** that fit the facts equally well.\nA hypothesis is valid only if it holds in **all** of them \u2014 we call the fraction the *support*."},{"cell":14,"kind":"code","heading":"3. Stage 2 \u2014 Facts \u2192 causal graph (PC algorithm)","source":"def draw_pdag(pdag, ax, title):\n    g = nx.DiGraph(); g.add_nodes_from(pdag.nodes)\n    pos = nx.circular_layout(sorted(pdag.nodes))\n    nx.draw_networkx_nodes(g, pos, ax=ax, node_color=\"#dbe9f6\", node_size=900, edgecolors=\"#2b6cb0\")\n    nx.draw_networkx_labels(g, pos, ax=ax, font_weight=\"bold\")\n    nx.draw_networkx_edges(g, pos, edgelist=list(pdag.directed), ax=ax, arrowsize=20, width=2, node_size=900)\n    nx.draw_networkx_edges(g.to_undirected(), pos, edgelist=[tuple(e) for e in pdag.undirected],\n                           ax=ax, style=\"dashed\", width=2, edge_color=\"gray\")\n    ax.set_title(title); ax.axis(\"off\")\n\npdag = pc_from_premise(facts)\ndags = equivalent_dags(pdag)\nfig, ax = plt.subplots(figsize=(4.5, 4))\ndraw_pdag(pdag, ax, f\"PDAG from the premise above\\n({len(dags)} equivalent DAG(s))\")\nplt.show()\n\n(a, b), (c, d) = sorted(pdag.directed)[0], sorted(tuple(sorted(e)) for e in pdag.undirected)[0]\nfor rel, x, y in [(\"direct\", a, b), (\"direct\", c, d), (\"direct\", d, c), (\"indirect\", d, b)]:\n    print(f\"support({rel:8s}, {x}, {y}) = {support(dags, rel, x, y):.2f}\")","snippet":{"id":"nb:14","title":"Notebook cell 14","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["def draw_pdag(pdag, ax, title):","    g = nx.DiGraph(); g.add_nodes_from(pdag.nodes)","    pos = nx.circular_layout(sorted(pdag.nodes))","    nx.draw_networkx_nodes(g, pos, ax=ax, node_color=\"#dbe9f6\", node_size=900, edgecolors=\"#2b6cb0\")","    nx.draw_networkx_labels(g, pos, ax=ax, font_weight=\"bold\")","    nx.draw_networkx_edges(g, pos, edgelist=list(pdag.directed), ax=ax, arrowsize=20, width=2, node_size=900)","    nx.draw_networkx_edges(g.to_undirected(), pos, edgelist=[tuple(e) for e in pdag.undirected],","                           ax=ax, style=\"dashed\", width=2, edge_color=\"gray\")","    ax.set_title(title); ax.axis(\"off\")","","pdag = pc_from_premise(facts)","dags = equivalent_dags(pdag)","fig, ax = plt.subplots(figsize=(4.5, 4))","draw_pdag(pdag, ax, f\"PDAG from the premise above\\n({len(dags)} equivalent DAG(s))\")","plt.show()","","(a, b), (c, d) = sorted(pdag.directed)[0], sorted(tuple(sorted(e)) for e in pdag.undirected)[0]","for rel, x, y in [(\"direct\", a, b), (\"direct\", c, d), (\"direct\", d, c), (\"indirect\", d, b)]:","    print(f\"support({rel:8s}, {x}, {y}) = {support(dags, rel, x, y):.2f}\")"],"notes":{"0":"Helper that draws a PDAG: solid arrows = proven, dashed lines = undecided.","1":"Empty directed graph holding just the nodes, so networkx can place them.","2":"Put the variables on a circle (sorted, so A is always in the same place).","3":"Draw the circles.","4":"Write the letters inside.","5":"Draw proven arrows.","6":"Draw the undecided edges as grey dashed lines (no arrow heads).","8":"Add the title and hide the axes.","10":"Run PC (skeleton \u2192 v-structures \u2192 Meek) on the facts from cell 9.","11":"List every possible world (DAG) the PDAG stands for.","12":"Make a blank figure.","13":"Draw it, with the number of possible worlds in the title.","16":"Pick one proven arrow (a \u2192 b) and one dashed edge (c \u2013 d) to test claims on.","17":"Four claims: the proven arrow, both directions of the dashed edge, and an indirect claim.","18":"support = share of possible worlds where the claim holds. 1.00 means proven."},"summary":"Stage 2 demo: draw the PDAG for the teaching premise and compute support for a few claims."}},{"cell":15,"kind":"markdown","heading":"4. Stage 3 + 4 \u2014 Features and classifiers","source":"## 4. Stage 3 + 4 \u2014 Features and classifiers\n\nEach (premise, hypothesis) becomes one row of numbers. Three feature groups, added one at a time\nso we can see how much each reasoning step helps:\n\n| group | features | intuition |\n|---|---|---|\n| relation | one-hot of the 4 relation types | what is being claimed |\n| **text facts** | number of variables, X\u2013Y correlated, X\u2013Y joined in skeleton, #separating sets, smallest separating set, degrees, #common neighbours | read directly off the sentences |\n| **PC graph** | X\u2192Y, Y\u2192X, undirected, X ancestor of Y (definite / possible) and reverse, #common children, #common parents | read off the PDAG |\n| **support** | fraction of equivalent DAGs where the claim holds, number of equivalent DAGs | \"how many possible worlds agree\" |\n\nNone of the features uses the variable *names*, so renaming variables cannot fool them."},{"cell":16,"kind":"code","heading":"4. Stage 3 + 4 \u2014 Features and classifiers","source":"t0 = time.time()\nfeatures = {name: build_feature_table(df.input) for name, df in data.items()}\nprint(f\"Built features for {sum(map(len, features.values())):,} rows in {time.time() - t0:.1f}s\")\nfeatures[\"test\"][[\"relation\", \"x\", \"y\"] + TEXT_FACT_FEATURES[:4] + [\"edge_x_to_y\", \"support\"]].head(6)","snippet":{"id":"nb:16","title":"Notebook cell 16","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["t0 = time.time()","features = {name: build_feature_table(df.input) for name, df in data.items()}","print(f\"Built features for {sum(map(len, features.values())):,} rows in {time.time() - t0:.1f}s\")","features[\"test\"][[\"relation\", \"x\", \"y\"] + TEXT_FACT_FEATURES[:4] + [\"edge_x_to_y\", \"support\"]].head(6)"],"notes":{"0":"Start a stopwatch.","1":"For each dataset, build the feature table (premises are cached, so this takes ~11 s for 212k rows).","2":"Report how many rows and how long it took.","3":"Peek at a few columns of the first six test rows."},"summary":"Stage 3: turn every row of every dataset into a row of numbers (features)."}},{"cell":17,"kind":"markdown","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"### 4.1 Pure-text baseline: TF-IDF + logistic regression\nNo parsing, no reasoning \u2014 just word / n-gram counts of premise and hypothesis.\n(This is the fair ML counterpart of an end-to-end transformer in Phase 2.)"},{"cell":18,"kind":"code","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"def scores(y_true, y_pred):\n    return {\"precision\": precision_score(y_true, y_pred, zero_division=0),\n            \"recall\": recall_score(y_true, y_pred, zero_division=0),\n            \"f1\": f1_score(y_true, y_pred, zero_division=0),\n            \"accuracy\": accuracy_score(y_true, y_pred)}\n\nEVAL_SETS = [\"dev\", \"test\", \"refactorization\", \"paraphrase\"]\ntoken = r\"(?u)\\b\\w+\\b\"  # keep one-letter tokens: the variable names\ntfidf_lr = make_pipeline(\n    ColumnTransformer([\n        (\"premise\", TfidfVectorizer(token_pattern=token, ngram_range=(1, 3), min_df=5, max_features=50_000, sublinear_tf=True), \"premise\"),\n        (\"hypothesis\", TfidfVectorizer(token_pattern=token, ngram_range=(1, 3), min_df=2, sublinear_tf=True), \"hypothesis\"),\n    ]),\n    LogisticRegression(max_iter=2000, class_weight=\"balanced\"),\n)\nt0 = time.time()\ntfidf_lr.fit(data[\"train\"], data[\"train\"].label)\ntfidf_results = {s: scores(data[s].label, tfidf_lr.predict(data[s])) for s in EVAL_SETS}\nprint(f\"trained in {time.time() - t0:.0f}s\")\npd.DataFrame(tfidf_results).T.round(3)","snippet":{"id":"nb:18","title":"Notebook cell 18","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["def scores(y_true, y_pred):","    return {\"precision\": precision_score(y_true, y_pred, zero_division=0),","            \"recall\": recall_score(y_true, y_pred, zero_division=0),","            \"f1\": f1_score(y_true, y_pred, zero_division=0),","            \"accuracy\": accuracy_score(y_true, y_pred)}","","EVAL_SETS = [\"dev\", \"test\", \"refactorization\", \"paraphrase\"]","token = r\"(?u)\\b\\w+\\b\"  # keep one-letter tokens: the variable names","tfidf_lr = make_pipeline(","    ColumnTransformer([","        (\"premise\", TfidfVectorizer(token_pattern=token, ngram_range=(1, 3), min_df=5, max_features=50_000, sublinear_tf=True), \"premise\"),","        (\"hypothesis\", TfidfVectorizer(token_pattern=token, ngram_range=(1, 3), min_df=2, sublinear_tf=True), \"hypothesis\"),","    ]),","    LogisticRegression(max_iter=2000, class_weight=\"balanced\"),",")","t0 = time.time()","tfidf_lr.fit(data[\"train\"], data[\"train\"].label)","tfidf_results = {s: scores(data[s].label, tfidf_lr.predict(data[s])) for s in EVAL_SETS}","print(f\"trained in {time.time() - t0:.0f}s\")","pd.DataFrame(tfidf_results).T.round(3)"],"notes":{"0":"Helper returning the four metrics for the 'valid' class.","1":"Precision: of the claims we called valid, how many really are.","2":"Recall: of the truly valid claims, how many we found.","3":"F1: one number balancing precision and recall (their harmonic mean).","4":"Accuracy: share of all rows predicted correctly (misleading here: 83% of rows are 0).","6":"The four sets we always report.","7":"Count one-letter words too; the default pattern would throw away the variable names A, B, C.","8":"Build the baseline model as a pipeline:","10":"Premise text \u2192 TF-IDF numbers for words and 1-3 word phrases (ignore rare ones, keep top 50k).","11":"Hypothesis text \u2192 its own separate TF-IDF numbers.","13":"Linear classifier; 'balanced' makes the rare valid class count more.","16":"Train on all 205k training rows (~40 s).","17":"Predict and score each evaluation set.","18":"Report training time.","19":"Show the score table. Watch the drop on refactorization: the model learned letter names."},"summary":"Text-only baseline: TF-IDF word statistics + logistic regression, with no reasoning at all."}},{"cell":19,"kind":"markdown","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"TF-IDF gets some signal in-distribution but collapses when variables are renamed: it learned a\n**shortcut** \u2014 in Corr2Cause the variables are named in causal order, so \"a later letter causes an\nearlier letter\" is almost always false. Words are not reasoning.\n\n### 4.2 Feature-based models (ablation)"},{"cell":20,"kind":"code","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"def predict(model, feats, cols):\n    # Rows whose hypothesis could not be parsed get \"not valid\" (the extractor found no triple).\n    pred = np.zeros(len(feats), dtype=int)\n    ok = (feats.parsed == 1).values\n    if ok.any():\n        pred[ok] = model.predict(feats.loc[ok, cols])\n    return pred\n\nfeature_groups = {\n    \"relation + text facts\": RELATION_FEATURES + TEXT_FACT_FEATURES,\n    \"+ PC graph\": RELATION_FEATURES + TEXT_FACT_FEATURES + PC_GRAPH_FEATURES,\n    \"+ support (all)\": ALL_FEATURES,\n}\nmodel_makers = {\n    \"Logistic Regression\": lambda: make_pipeline(StandardScaler(), LogisticRegression(max_iter=3000)),\n    \"Decision Tree (depth 4)\": lambda: DecisionTreeClassifier(max_depth=4, random_state=SEED),\n    \"Random Forest\": lambda: RandomForestClassifier(n_estimators=300, min_samples_leaf=2, n_jobs=-1, random_state=SEED),\n}\nrows, trained = [], {}\ny_train = data[\"train\"].label\nfor group, cols in feature_groups.items():\n    for name, make in model_makers.items():\n        model = make().fit(features[\"train\"][cols], y_train)\n        trained[(group, name)] = model\n        row = {\"features\": group, \"model\": name}\n        row.update({s: f1_score(data[s].label, predict(model, features[s], cols)) for s in [\"dev\", \"test\", \"refactorization\"]})\n        rows.append(row)\nablation = pd.DataFrame(rows)\nprint(\"F1 of the valid class\")\nablation.round(3)","snippet":{"id":"nb:20","title":"Notebook cell 20","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["def predict(model, feats, cols):","    # Rows whose hypothesis could not be parsed get \"not valid\" (the extractor found no triple).","    pred = np.zeros(len(feats), dtype=int)","    ok = (feats.parsed == 1).values","    if ok.any():","        pred[ok] = model.predict(feats.loc[ok, cols])","    return pred","","feature_groups = {","    \"relation + text facts\": RELATION_FEATURES + TEXT_FACT_FEATURES,","    \"+ PC graph\": RELATION_FEATURES + TEXT_FACT_FEATURES + PC_GRAPH_FEATURES,","    \"+ support (all)\": ALL_FEATURES,","}","model_makers = {","    \"Logistic Regression\": lambda: make_pipeline(StandardScaler(), LogisticRegression(max_iter=3000)),","    \"Decision Tree (depth 4)\": lambda: DecisionTreeClassifier(max_depth=4, random_state=SEED),","    \"Random Forest\": lambda: RandomForestClassifier(n_estimators=300, min_samples_leaf=2, n_jobs=-1, random_state=SEED),","}","rows, trained = [], {}","y_train = data[\"train\"].label","for group, cols in feature_groups.items():","    for name, make in model_makers.items():","        model = make().fit(features[\"train\"][cols], y_train)","        trained[(group, name)] = model","        row = {\"features\": group, \"model\": name}","        row.update({s: f1_score(data[s].label, predict(model, features[s], cols)) for s in [\"dev\", \"test\", \"refactorization\"]})","        rows.append(row)","ablation = pd.DataFrame(rows)","print(\"F1 of the valid class\")","ablation.round(3)"],"notes":{"0":"Helper: predict for rows the reader understood; rows it could not read get 0 (not valid).","2":"Start with all zeros.","3":"Mask of rows whose hypothesis was parsed.","5":"Fill in model predictions for those rows only.","8":"Three feature sets, each adding one reasoning step:","9":"only what the sentences say,","10":"plus what the PC graph shows,","11":"plus the possible-worlds support score.","13":"Three model types, created fresh for each feature set:","14":"scaled features \u2192 linear model,","15":"a flowchart at most 4 questions deep,","16":"300 trees voting.","18":"Collect result rows and keep every trained model.","19":"Training labels.","20":"Loop over feature sets\u2026","21":"\u2026and model types (9 combinations).","22":"Train on the training features.","23":"Remember the model.","25":"Score F1 on dev, test and refactorization.","27":"The ablation table: about 0.5 \u2192 0.93 \u2192 1.0 as reasoning is added."},"summary":"Stage 4: train 3 models \u00d7 3 feature groups (the ablation) and score each."}},{"cell":21,"kind":"markdown","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"**Reading the table**\n* Text facts alone are not enough \u2014 the answer depends on *combinations* of facts.\n* Adding the PC graph features gives a large jump: the causal-discovery rules do the hard reasoning.\n* Adding *support* makes the task almost solved, and a **depth-4 decision tree** is enough.\n  Because all three models agree, we pick the simplest one to explain.\n\n### 4.3 Final model: decision tree on all features"},{"cell":22,"kind":"code","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"final_cols = ALL_FEATURES\nfinal_model = trained[(\"+ support (all)\", \"Decision Tree (depth 4)\")]\nprint(export_text(final_model, feature_names=final_cols, decimals=2))","snippet":{"id":"nb:22","title":"Notebook cell 22","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["final_cols = ALL_FEATURES","final_model = trained[(\"+ support (all)\", \"Decision Tree (depth 4)\")]","print(export_text(final_model, feature_names=final_cols, decimals=2))"],"notes":{"0":"The final model uses every feature.","1":"Reuse the depth-4 decision tree already trained in cell 20.","2":"Print the whole tree as indented if/else rules."},"summary":"Pick the final model (depth-4 tree on all features) and print its rules."}},{"cell":23,"kind":"code","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"importance = pd.Series(final_model.feature_importances_, index=final_cols).sort_values()\nimportance[importance > 0].plot.barh(figsize=(6, 2.5), color=\"#2b6cb0\", title=\"Decision-tree feature importance\")\nplt.show()","snippet":{"id":"nb:23","title":"Notebook cell 23","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["importance = pd.Series(final_model.feature_importances_, index=final_cols).sort_values()","importance[importance > 0].plot.barh(figsize=(6, 2.5), color=\"#2b6cb0\", title=\"Decision-tree feature importance\")","plt.show()"],"notes":{"0":"Feature importance = how much each feature reduced impurity across the tree's splits.","1":"Plot only the features the tree used; support dominates."},"summary":"Bar chart of which features the tree actually uses."}},{"cell":24,"kind":"markdown","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"The tree's main rule is simply **\"valid if support \u2248 1\"** \u2014 i.e. *a causal claim is entailed only if\nit holds in every DAG consistent with the data*. The small extra branch for `confounder`\nabsorbs a quirk in how the dataset generator defined \"common cause\"."},{"cell":25,"kind":"code","heading":"4.1 Pure-text baseline: TF-IDF + logistic regression","source":"test_feats = features[\"test\"]\ntest_pred = predict(final_model, test_feats, final_cols)\nper_relation = pd.DataFrame({rel: scores(data[\"test\"].label[test_feats.relation == rel], test_pred[(test_feats.relation == rel).values])\n                             for rel in RELATIONS}).T\nper_relation[\"n valid\"] = [int(data[\"test\"].label[test_feats.relation == r].sum()) for r in RELATIONS]\ndisplay(per_relation.round(3))\nConfusionMatrixDisplay.from_predictions(data[\"test\"].label, test_pred, display_labels=[\"not valid\", \"valid\"],\n                                        cmap=\"Blues\", colorbar=False)\nplt.title(\"Decision tree \u2014 test set\"); plt.show()","snippet":{"id":"nb:25","title":"Notebook cell 25","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["test_feats = features[\"test\"]","test_pred = predict(final_model, test_feats, final_cols)","per_relation = pd.DataFrame({rel: scores(data[\"test\"].label[test_feats.relation == rel], test_pred[(test_feats.relation == rel).values])","                             for rel in RELATIONS}).T","per_relation[\"n valid\"] = [int(data[\"test\"].label[test_feats.relation == r].sum()) for r in RELATIONS]","display(per_relation.round(3))","ConfusionMatrixDisplay.from_predictions(data[\"test\"].label, test_pred, display_labels=[\"not valid\", \"valid\"],","                                        cmap=\"Blues\", colorbar=False)","plt.title(\"Decision tree \u2014 test set\"); plt.show()"],"notes":{"0":"Test-set features.","1":"Final predictions on test.","2":"Score each relation type (direct, indirect, collider, confounder) separately.","4":"How many truly valid claims of each type exist in test.","5":"Show the table.","6":"2\u00d72 grid: true vs predicted (valid / not valid).","8":"Title and show."},"summary":"Final model on the test set: scores per relation type and a confusion matrix."}},{"cell":26,"kind":"markdown","heading":"4.4 Robustness and comparison summary","source":"### 4.4 Robustness and comparison summary"},{"cell":27,"kind":"code","heading":"4.4 Robustness and comparison summary","source":"final_results = {s: scores(data[s].label, predict(final_model, features[s], final_cols)) for s in EVAL_SETS}\noriginal_test = load_split(\"test\", corrected=False)\nsummary = pd.DataFrame({\n    \"TF-IDF + LR (text only)\": {s: tfidf_results[s][\"f1\"] for s in EVAL_SETS},\n    \"Rules + PC + Decision Tree\": {s: final_results[s][\"f1\"] for s in EVAL_SETS},\n}).T\nsummary[\"test (original labels)\"] = [\n    f1_score(original_test.label, tfidf_lr.predict(original_test)),\n    f1_score(original_test.label, predict(final_model, features[\"test\"], final_cols)),\n]\nprint(\"F1 of the valid class\")\nsummary.round(3)","snippet":{"id":"nb:27","title":"Notebook cell 27","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["final_results = {s: scores(data[s].label, predict(final_model, features[s], final_cols)) for s in EVAL_SETS}","original_test = load_split(\"test\", corrected=False)","summary = pd.DataFrame({","    \"TF-IDF + LR (text only)\": {s: tfidf_results[s][\"f1\"] for s in EVAL_SETS},","    \"Rules + PC + Decision Tree\": {s: final_results[s][\"f1\"] for s in EVAL_SETS},","}).T","summary[\"test (original labels)\"] = [","    f1_score(original_test.label, tfidf_lr.predict(original_test)),","    f1_score(original_test.label, predict(final_model, features[\"test\"], final_cols)),","]","print(\"F1 of the valid class\")","summary.round(3)"],"notes":{"0":"Score the final model on all four evaluation sets.","1":"Also load the test set with the ORIGINAL (buggy) labels, for comparison with the paper.","2":"One row per system, one column per test set (F1).","6":"Extra column: F1 against the original labels."},"summary":"Summary table: text-only baseline vs our pipeline on every test set, plus original labels."}},{"cell":28,"kind":"markdown","heading":"4.4 Robustness and comparison summary","source":"* The neuro-symbolic ML pipeline is near-perfect on template text and **unaffected by renaming**\n  (its features never look at names).\n* Both models fail on **paraphrased** hypotheses; the rule pipeline scores 0 because its parser\n  returns nothing. Fixing the *language* side without losing the *reasoning* side is Phase 2's job.\n\n## 5. Stage 5 \u2014 Graph stage: triples \u2192 DAG \u2192 Bayesian network \u2192 do-queries\n\nOnly triples the classifier marks **valid** (\"reviewed predictions\") enter the graph stage.\nFor each test premise we take the predicted `X directly causes Y` triples, add them from most to\nleast confident, and **skip any edge that would close a cycle** (a DAG cannot contain one)."},{"cell":29,"kind":"code","heading":"4.4 Robustness and comparison summary","source":"test = data[\"test\"]\ntriples = pd.DataFrame({\n    \"premise_id\": test.premise_id, \"relation\": test_feats.relation, \"x\": test_feats.x, \"y\": test_feats.y,\n    \"label\": test.label, \"prob\": final_model.predict_proba(test_feats[final_cols])[:, 1],\n})\npremise_info = {pid: analyse_premise(p)[0] for pid, p in test.groupby(\"premise_id\").premise.first().items()}\nnodes = {pid: f.variables for pid, f in premise_info.items()}\n\npredicted_dags = gs.dags_from_triples(triples, nodes)\nedge_scores = gs.edge_metrics(predicted_dags, triples)\npd.Series(edge_scores).round(3).to_frame(\"predicted DAGs vs gold edges\")","snippet":{"id":"nb:29","title":"Notebook cell 29","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["test = data[\"test\"]","triples = pd.DataFrame({","    \"premise_id\": test.premise_id, \"relation\": test_feats.relation, \"x\": test_feats.x, \"y\": test_feats.y,","    \"label\": test.label, \"prob\": final_model.predict_proba(test_feats[final_cols])[:, 1],","})","premise_info = {pid: analyse_premise(p)[0] for pid, p in test.groupby(\"premise_id\").premise.first().items()}","nodes = {pid: f.variables for pid, f in premise_info.items()}","","predicted_dags = gs.dags_from_triples(triples, nodes)","edge_scores = gs.edge_metrics(predicted_dags, triples)","pd.Series(edge_scores).round(3).to_frame(\"predicted DAGs vs gold edges\")"],"notes":{"0":"Shortcut to the test table.","1":"One row per claim: premise id, relation, x, y, gold label, and the tree's P(valid).","3":"predict_proba gives [P(not valid), P(valid)]; [:, 1] keeps P(valid).","5":"For each test premise, its parsed facts (cached from stage 1).","6":"Each premise's list of variables.","8":"Build a DAG per premise from 'direct' claims with P(valid) \u2265 0.5.","9":"Compare predicted arrows with the gold arrows: precision, recall, F1.","10":"Show the edge scores."},"summary":"Stage 5 start: collect the test predictions as triples, build one DAG per premise, score edges."}},{"cell":30,"kind":"markdown","heading":"4.4 Robustness and comparison summary","source":"**Acyclicity check in action** \u2014 feeding a deliberately contradictory set of candidate edges:"},{"cell":31,"kind":"code","heading":"4.4 Robustness and comparison summary","source":"candidates = [(\"A\", \"B\", 0.95), (\"B\", \"C\", 0.90), (\"C\", \"A\", 0.40), (\"B\", \"B\", 0.30)]\ndag, rejected = gs.build_dag([\"A\", \"B\", \"C\"], candidates)\nprint(\"kept    :\", list(dag.edges))\nprint(\"rejected:\", [(c, e) for c, e, _ in rejected], \"(cycle C\u2192A\u2192B\u2192C, self-loop B\u2192B)\")","snippet":{"id":"nb:31","title":"Notebook cell 31","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["candidates = [(\"A\", \"B\", 0.95), (\"B\", \"C\", 0.90), (\"C\", \"A\", 0.40), (\"B\", \"B\", 0.30)]","dag, rejected = gs.build_dag([\"A\", \"B\", \"C\"], candidates)","print(\"kept    :\", list(dag.edges))","print(\"rejected:\", [(c, e) for c, e, _ in rejected], \"(cycle C\u2192A\u2192B\u2192C, self-loop B\u2192B)\")"],"notes":{"0":"Four candidate arrows with confidences; C \u2192 A would close a loop, B \u2192 B is a self-loop.","1":"Add arrows from most to least confident, skipping any that would make a loop.","2":"Arrows that made it into the DAG.","3":"Arrows refused, and why."},"summary":"Show the cycle check working on a deliberately bad set of candidate arrows."}},{"cell":32,"kind":"code","heading":"4.4 Robustness and comparison summary","source":"gold_direct = triples[(triples.relation == \"direct\") & (triples.label == 1)]\npid = max(nodes, key=lambda p: (len(nodes[p]), len(predicted_dags[p].edges)))  # a large example\n\nfig, axes = plt.subplots(1, 3, figsize=(13, 4))\ndraw_pdag(pc_from_premise(premise_info[pid]), axes[0], \"PC output (PDAG)\")\nfor ax, (title, edges) in zip(axes[1:], [\n        (\"Predicted DAG (decision tree)\", list(predicted_dags[pid].edges)),\n        (\"Gold direct-cause edges\", list(zip(gold_direct[gold_direct.premise_id == pid].x,\n                                             gold_direct[gold_direct.premise_id == pid].y)))]):\n    g = nx.DiGraph(edges); g.add_nodes_from(nodes[pid])\n    pos = nx.circular_layout(sorted(g.nodes))\n    nx.draw_networkx(g, pos, ax=ax, node_color=\"#dbe9f6\", edgecolors=\"#2b6cb0\", node_size=900,\n                     arrowsize=20, width=2, font_weight=\"bold\")\n    ax.set_title(title); ax.axis(\"off\")\nplt.tight_layout(); plt.show()","snippet":{"id":"nb:32","title":"Notebook cell 32","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["gold_direct = triples[(triples.relation == \"direct\") & (triples.label == 1)]","pid = max(nodes, key=lambda p: (len(nodes[p]), len(predicted_dags[p].edges)))  # a large example","","fig, axes = plt.subplots(1, 3, figsize=(13, 4))","draw_pdag(pc_from_premise(premise_info[pid]), axes[0], \"PC output (PDAG)\")","for ax, (title, edges) in zip(axes[1:], [","        (\"Predicted DAG (decision tree)\", list(predicted_dags[pid].edges)),","        (\"Gold direct-cause edges\", list(zip(gold_direct[gold_direct.premise_id == pid].x,","                                             gold_direct[gold_direct.premise_id == pid].y)))]):","    g = nx.DiGraph(edges); g.add_nodes_from(nodes[pid])","    pos = nx.circular_layout(sorted(g.nodes))","    nx.draw_networkx(g, pos, ax=ax, node_color=\"#dbe9f6\", edgecolors=\"#2b6cb0\", node_size=900,","                     arrowsize=20, width=2, font_weight=\"bold\")","    ax.set_title(title); ax.axis(\"off\")","plt.tight_layout(); plt.show()"],"notes":{"0":"Gold arrows: 'direct' claims labelled valid.","1":"Choose the premise with the most variables and arrows (a rich picture).","3":"Three panels side by side.","4":"Panel 1: the PC output, dashed edges included.","5":"Panels 2 and 3: predicted arrows, then gold arrows.","9":"Make a graph from the arrow list (keep isolated variables too).","10":"Same circle layout, so the panels line up.","11":"Draw nodes, labels and arrows in one call.","14":"Tidy spacing and show."},"summary":"Draw PC output vs predicted DAG vs gold arrows side by side for one large premise."}},{"cell":33,"kind":"markdown","heading":"5.1 Bayesian network and intervention queries","source":"### 5.1 Bayesian network and intervention queries\n\nCorr2Cause gives the *structure* but no measurements, so each DAG gets simple, clearly illustrative\n**noisy-OR** probabilities: every variable is on with 10 % probability by itself, and each active\ncause switches it on with 70 % probability. pgmpy then answers **do-queries** \u2014\n*\"if we force X on vs off, how much does P(Y = 1) change?\"* (average causal effect, ACE).\n\n**Known queries** are the ones whose answer is fixed by the gold labels and the text:\n* **yes** \u2014 X directly or indirectly causes Y (gold label 1);\n* **no** \u2014 Y causes X (an effect cannot cause its own cause), or X and Y are not even correlated."},{"cell":34,"kind":"code","heading":"5.1 Bayesian network and intervention queries","source":"correlated = {pid: (f.variables, f.correlated) for pid, f in premise_info.items()}\nqueries = gs.known_intervention_queries(triples, correlated)\nanswered = gs.answer_queries(queries, predicted_dags)\nanswered[\"correct\"] = answered.gold_effect == answered.predicted_effect\nquery_accuracy = answered.correct.mean()\nprint(f\"{len(answered)} known queries over {answered.premise_id.nunique()} premises \u2014 accuracy {query_accuracy:.3f}\")\nanswered.groupby(\"gold_effect\").correct.agg([\"size\", \"mean\"]).rename(columns={\"size\": \"queries\", \"mean\": \"accuracy\"})","snippet":{"id":"nb:34","title":"Notebook cell 34","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["correlated = {pid: (f.variables, f.correlated) for pid, f in premise_info.items()}","queries = gs.known_intervention_queries(triples, correlated)","answered = gs.answer_queries(queries, predicted_dags)","answered[\"correct\"] = answered.gold_effect == answered.predicted_effect","query_accuracy = answered.correct.mean()","print(f\"{len(answered)} known queries over {answered.premise_id.nunique()} premises \u2014 accuracy {query_accuracy:.3f}\")","answered.groupby(\"gold_effect\").correct.agg([\"size\", \"mean\"]).rename(columns={\"size\": \"queries\", \"mean\": \"accuracy\"})"],"notes":{"0":"For each premise: its variables and correlated pairs (needed to build 'no effect' questions).","1":"Questions 'does forcing X change Y?' whose true answer we know from labels and text.","2":"Answer each one with a noisy-OR Bayesian network on the predicted DAG.","3":"Did the network's yes/no match the known answer?","4":"Share answered correctly (0.975).","5":"Report the count and accuracy.","6":"Accuracy split by true answer: 'no' questions are all right; misses are 'yes' questions."},"summary":"Ask every 'known' what-if question with the Bayesian network and measure accuracy."}},{"cell":35,"kind":"code","heading":"5.1 Bayesian network and intervention queries","source":"answered[~answered.correct]","snippet":{"id":"nb:35","title":"Notebook cell 35","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["answered[~answered.correct]"],"notes":{"0":"~ means NOT: show only the wrong rows. All are causal chains through an undecided edge."},"summary":"List the what-if questions the network got wrong."}},{"cell":36,"kind":"markdown","heading":"5.1 Bayesian network and intervention queries","source":"The few misses are chains X \u2192 \u2026 \u2192 Y that pass through an edge whose direction the correlations\n**cannot identify** (a dashed edge in the PDAG). The direct-edge DAG leaves such edges out, so the\nBayesian network cannot see the path. This is a limit of observational data, not of the extractor.\n\n### 5.2 Why the Bayesian network matters: correlation \u2260 causation\nWhen X and Y share a common cause, observing X = 1 tells us more about Y than *setting* X = 1 does."},{"cell":37,"kind":"code","heading":"5.1 Bayesian network and intervention queries","source":"best = None\nfor pid, dag in predicted_dags.items():\n    bn = gs.noisy_or_network(dag)\n    for x, y in dag.edges:\n        if set(dag.predecessors(x)) & set(dag.predecessors(y)):  # X and Y share a parent\n            gap = gs.observational_effect(bn, x, y) - gs.interventional_effect(bn, x, y)\n            if best is None or gap > best[0]:\n                best = (gap, pid, x, y, bn)\ngap, pid, x, y, bn = best\nz = sorted(set(predicted_dags[pid].predecessors(x)) & set(predicted_dags[pid].predecessors(y)))\nprint(f\"Premise {pid}: {x} \u2192 {y}, common cause(s) {z}\")\nprint(f\"  observational  P({y}=1|{x}=1) - P({y}=1|{x}=0)         = {gs.observational_effect(bn, x, y):.3f}\")\nprint(f\"  interventional P({y}=1|do({x}=1)) - P({y}=1|do({x}=0)) = {gs.interventional_effect(bn, x, y):.3f}\")","snippet":{"id":"nb:37","title":"Notebook cell 37","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["best = None","for pid, dag in predicted_dags.items():","    bn = gs.noisy_or_network(dag)","    for x, y in dag.edges:","        if set(dag.predecessors(x)) & set(dag.predecessors(y)):  # X and Y share a parent","            gap = gs.observational_effect(bn, x, y) - gs.interventional_effect(bn, x, y)","            if best is None or gap > best[0]:","                best = (gap, pid, x, y, bn)","gap, pid, x, y, bn = best","z = sorted(set(predicted_dags[pid].predecessors(x)) & set(predicted_dags[pid].predecessors(y)))","print(f\"Premise {pid}: {x} \u2192 {y}, common cause(s) {z}\")","print(f\"  observational  P({y}=1|{x}=1) - P({y}=1|{x}=0)         = {gs.observational_effect(bn, x, y):.3f}\")","print(f\"  interventional P({y}=1|do({x}=1)) - P({y}=1|do({x}=0)) = {gs.interventional_effect(bn, x, y):.3f}\")"],"notes":{"0":"Will hold the example with the biggest gap.","1":"Look at every premise's DAG\u2026","2":"\u2026turn it into a Bayesian network\u2026","3":"\u2026and check every arrow X \u2192 Y.","4":"Only pairs with a shared cause (a confounder), where seeing \u2260 forcing.","5":"Gap = (effect of seeing X) \u2212 (effect of forcing X).","6":"Keep the biggest gap so far.","8":"Unpack the winner.","9":"The shared causes, for printing.","11":"Seeing: P(Y=1 | X=1) \u2212 P(Y=1 | X=0). Includes the confounder's influence.","12":"Forcing: P(Y=1 | do(X=1)) \u2212 P(Y=1 | do(X=0)). Only X's own effect."},"summary":"Find the clearest example where seeing X and forcing X give different answers."}},{"cell":38,"kind":"markdown","heading":"5.3 Fitting the network from data with pgmpy","source":"### 5.3 Fitting the network from data with pgmpy\nWith real measurements (e.g. a clinical table) the probabilities would be **learned**, not assumed.\nTo show that step we draw 5,000 samples from the reference network above, fit a fresh network with\nthe *predicted* structure by maximum likelihood, and check that the fitted model gives the same causal effect."},{"cell":39,"kind":"code","heading":"5.3 Fitting the network from data with pgmpy","source":"from pgmpy.models import DiscreteBayesianNetwork\nsamples = bn.simulate(5000, seed=SEED, show_progress=False)\nfitted = DiscreteBayesianNetwork(list(predicted_dags[pid].edges))\nfitted.add_nodes_from(predicted_dags[pid].nodes)\nfitted.fit(samples)\nprint(f\"ACE of {x} on {y}: reference {gs.interventional_effect(bn, x, y):.3f} | fitted from samples {gs.interventional_effect(fitted, x, y):.3f}\")","snippet":{"id":"nb:39","title":"Notebook cell 39","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["from pgmpy.models import DiscreteBayesianNetwork","samples = bn.simulate(5000, seed=SEED, show_progress=False)","fitted = DiscreteBayesianNetwork(list(predicted_dags[pid].edges))","fitted.add_nodes_from(predicted_dags[pid].nodes)","fitted.fit(samples)","print(f\"ACE of {x} on {y}: reference {gs.interventional_effect(bn, x, y):.3f} | fitted from samples {gs.interventional_effect(fitted, x, y):.3f}\")"],"notes":{"0":"pgmpy's Bayesian network class.","1":"Draw 5,000 rows of fake 0/1 data from the reference network (Corr2Cause has no real measurements).","2":"A fresh network with the predicted structure but no numbers yet.","3":"Include variables that have no arrows.","4":"Learn every probability table by counting in the data (maximum likelihood).","5":"The learned network gives nearly the same causal effect as the reference (0.51 vs 0.49)."},"summary":"Show that pgmpy can LEARN the probabilities from data, using simulated samples."}},{"cell":40,"kind":"markdown","heading":"6. Results summary (saved for the Phase 2 comparison)","source":"## 6. Results summary (saved for the Phase 2 comparison)"},{"cell":41,"kind":"code","heading":"6. Results summary (saved for the Phase 2 comparison)","source":"phase1 = pd.DataFrame([\n    {\"model\": \"TF-IDF + LR (text only)\", \"stage\": \"relation extraction\",\n     **{f\"{s}_f1\": tfidf_results[s][\"f1\"] for s in EVAL_SETS}},\n    {\"model\": \"Rules + PC + Decision Tree\", \"stage\": \"relation extraction\",\n     **{f\"{s}_f1\": final_results[s][\"f1\"] for s in EVAL_SETS},\n     \"edge_precision\": edge_scores[\"edge_precision\"], \"edge_recall\": edge_scores[\"edge_recall\"],\n     \"intervention_query_accuracy\": query_accuracy},\n])\nphase1.to_csv(RESULTS / \"phase1_metrics.csv\", index=False)\ntriples.to_csv(RESULTS / \"phase1_test_triples.csv\", index=False)\nphase1.round(3).T","snippet":{"id":"nb:41","title":"Notebook cell 41","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["phase1 = pd.DataFrame([","    {\"model\": \"TF-IDF + LR (text only)\", \"stage\": \"relation extraction\",","     **{f\"{s}_f1\": tfidf_results[s][\"f1\"] for s in EVAL_SETS}},","    {\"model\": \"Rules + PC + Decision Tree\", \"stage\": \"relation extraction\",","     **{f\"{s}_f1\": final_results[s][\"f1\"] for s in EVAL_SETS},","     \"edge_precision\": edge_scores[\"edge_precision\"], \"edge_recall\": edge_scores[\"edge_recall\"],","     \"intervention_query_accuracy\": query_accuracy},","])","phase1.to_csv(RESULTS / \"phase1_metrics.csv\", index=False)","triples.to_csv(RESULTS / \"phase1_test_triples.csv\", index=False)","phase1.round(3).T"],"notes":{"0":"One row per system with all its metrics.","1":"Baseline row: only text-level F1 scores.","3":"Our pipeline: F1 scores plus edge precision/recall and what-if accuracy.","8":"Save metrics.","9":"Save every test prediction (Phase 2 will produce the same table)."},"summary":"Save the Phase 1 results so the Phase 2 notebook can compare against them."}},{"cell":42,"kind":"markdown","heading":"Take-aways for the viva","source":"### Take-aways for the viva\n1. **Separate language from reasoning.** Rules extract facts; causal-discovery logic (PC) does the\n   reasoning; a depth-4 decision tree learns the final decision. Each step is inspectable.\n2. **Reasoning features matter most:** F1 goes from about 0.5 (text facts) \u2192 about 0.93 (PC graph) \u2192 about 1.0 (support).\n3. **Text-only ML learns shortcuts** (variable order) and breaks when names change; our features cannot.\n4. **The graph stage adds what extraction cannot:** guaranteed acyclicity, probabilities, and\n   intervention answers that differ from correlations.\n5. **Open gap \u2192 Phase 2:** the hand-written parser reads 0 % of paraphrased text. DistilBERT will\n   replace the language layer while the reasoning and graph layers stay the same."}],"feature_groups":{"relation":["rel_direct","rel_indirect","rel_collider","rel_confounder"],"text facts":["n_vars","marginally_correlated","adjacent","n_sepsets","min_sepset_size","degree_x","degree_y","n_common_neighbours"],"PC graph":["edge_x_to_y","edge_y_to_x","edge_undirected","x_ancestor_of_y","y_ancestor_of_x","x_possible_ancestor_of_y","y_possible_ancestor_of_x","n_common_children","n_common_parents"],"support":["support","n_equivalent_dags"]},"feature_meaning":{"rel_direct":"1 if the claim is 'X directly causes Y'","rel_indirect":"1 if the claim is 'X causes Y through something else'","rel_collider":"1 if the claim is 'X and Y have a common effect'","rel_confounder":"1 if the claim is 'X and Y have a common cause'","n_vars":"how many variables the story has (2 to 6)","marginally_correlated":"1 if the text says X correlates with Y","adjacent":"1 if X and Y are joined in the skeleton (never independent)","n_sepsets":"how many different sets make X and Y independent","min_sepset_size":"size of the smallest such set (-1 if there is none)","degree_x":"how many variables X is directly joined to","degree_y":"how many variables Y is directly joined to","n_common_neighbours":"how many variables are joined to both X and Y","edge_x_to_y":"1 if the graph has a proven arrow X \u2192 Y","edge_y_to_x":"1 if the graph has a proven arrow Y \u2192 X","edge_undirected":"1 if X \u2013 Y is joined but the direction is unknown","x_ancestor_of_y":"1 if proven arrows lead from X to Y","y_ancestor_of_x":"1 if proven arrows lead from Y to X","x_possible_ancestor_of_y":"1 if a path X to Y exists when dashed lines may point either way","y_possible_ancestor_of_x":"1 if a path Y to X exists when dashed lines may point either way","n_common_children":"how many variables both X and Y point to (proven arrows)","n_common_parents":"how many variables point to both X and Y (proven arrows)","support":"share of possible worlds in which the claim is true (1.0 = proven)","n_equivalent_dags":"how many possible worlds fit the facts"},"stage_text":{"load":{"name":"Load the row","plain":"Think of the dataset as a big quiz book. Each question has a short story (the premise), a claim about the story (the hypothesis), and an answer key (the label: 1 = the claim must be true, 0 = the story does not prove it). Step one is simply opening the book at one question.","technical":"Each CSV row has `input` = 'Premise: \u2026 Hypothesis: \u2026' plus `label`. load_split() downloads the corrected-label CSV, splits `input` into premise and hypothesis columns, and gives every distinct premise an integer premise_id so later stages can group hypotheses by premise.","why":"Splitting by premise matters: one premise appears with up to 90 hypotheses, so if the same premise were in train and test the model could memorise it (text leakage). The official split keeps test premises unseen."},"parse":{"name":"Read the sentences","plain":"A computer cannot reason with English sentences, so we turn each sentence into a tidy note. 'A correlates with C' becomes the note correlated(A, C). It is like a clerk copying a messy letter into a form. The clerk only knows a few fixed sentence shapes; a new wording leaves the form empty.","technical":"Regular expressions match each sentence template: _HEADER (variables), _CORR (correlation), _MARG_INDEP (independent with no condition, sepset {}), _COND_INDEP (independent given S, sepset S). The hypothesis is matched against 5 patterns and becomes Hypothesis(relation, x, y), or None.","why":"This is the language layer. Everything after it works on facts only, so in Phase 2 we can replace just this step with DistilBERT and keep the rest identical, which makes the ML vs DL comparison fair."},"skeleton":{"name":"PC step 1: skeleton","plain":"Draw a line between two variables if nothing can ever 'explain away' their link. If A and B look related only because of something else (like ice cream and drowning, both caused by hot weather), then once you account for that something, the link disappears, so there is no direct line between them.","technical":"X \u2013 Y is kept iff no conditioning set S makes X \u22a5 Y | S, i.e. the pair has no separating set (sepset). Under the faithfulness assumption, a pair that is never independent must be directly causally linked.","why":"This finds WHO is directly connected to whom, but not the direction of the arrows yet."},"vstruct":{"name":"PC step 2: v-structures","plain":"Talent and luck are unrelated, but both cause success. Among successful people, if someone was not lucky they were probably talented: knowing the common effect links its causes. So if X and Y are unrelated, both touch Z, and Z is NOT one of the things that separates them, Z must be their common effect: X \u2192 Z \u2190 Y.","technical":"For every non-adjacent pair X, Y with a common neighbour Z: if Z is in none of X, Y's sepsets, orient X \u2192 Z \u2190 Y (an unshielded collider / v-structure). If Z IS in a sepset, Z is a chain or fork node, which conditioning blocks, so it cannot be a collider.","why":"Colliders are the only pattern that correlations alone can point at directly. They give the first arrow directions."},"meek":{"name":"PC step 3: Meek rules","plain":"Once some arrows are known, others follow by logic, like Sudoku: if one direction would create a pattern the facts rule out (a new collider, or a loop), the other direction must be right.","technical":"R1: W \u2192 U \u2013 V with W, V not adjacent \u21d2 U \u2192 V (else a new collider at U). R2: U \u2192 W \u2192 V and U \u2013 V \u21d2 U \u2192 V (else a cycle). R3: U \u2013 W1 \u2192 V, U \u2013 W2 \u2192 V, W1, W2 not adjacent \u21d2 U \u2192 V. Repeat until nothing changes.","why":"The output is a PDAG: arrows the data proves, dashed lines the data cannot decide."},"dags":{"name":"Possible worlds","plain":"Dashed lines could point either way. We list every way to point them that still fits the facts (no loops, no extra colliders). Each one is a 'possible world'. A claim is proven only if it is true in every possible world. The share of worlds where it is true is called support.","technical":"Enumerate all 2^k orientations of the k undirected edges; keep those that are acyclic and create no new v-structure. These are the Markov-equivalent DAGs (same independences). support = fraction of them in which relation_holds(dag, relation, x, y).","why":"Corr2Cause labels a claim 1 only if it holds in all equivalent DAGs. Support turns that rule into one number."},"features":{"name":"Turn it into numbers","plain":"A machine-learning model reads a row of numbers, not graphs. So we describe the claim with about two dozen numbers: what kind of claim it is, what the sentences said about the pair, what the graph shows, and the support score.","technical":"pair_features() builds 4 relation one-hot + 8 text-fact + 9 PC-graph + 2 support features. None uses variable names, so renaming A\u2192Z cannot change them.","why":"Splitting features into groups lets the notebook show how much each reasoning step adds (ablation)."},"tree":{"name":"Decision tree decides","plain":"A decision tree is a flowchart of yes/no questions learned from 205,734 solved examples. It found that one question does almost all the work: 'is the claim true in (nearly) every possible world?'","technical":"DecisionTreeClassifier(max_depth=4) trained on ALL_FEATURES. Each internal node tests feature \u2264 threshold; the leaf's share of valid training rows is P(valid). Prediction = P(valid) \u2265 0.5.","why":"We never hard-coded 'support must be 1'; the tree learned that rule from data, and it stays printable for the viva."},"graph":{"name":"Graph, network, what-if","plain":"Take every 'X directly causes Y' claim the tree accepted and draw it as an arrow. Then give the drawing some probabilities so we can ask what-if questions: if we FORCE X on, how much does Y change? That differs from just SEEING X on, because seeing can also hint at X's hidden causes.","technical":"build_dag() adds edges by confidence and skips cycles. noisy_or_network() attaches CPDs P(child=1 | k active parents) = 1 \u2212 0.9 \u00b7 0.3^k. CausalInference answers P(Y | do(X)); ACE = P(Y=1|do(X=1)) \u2212 P(Y=1|do(X=0)). Observational effect uses ordinary conditioning.","why":"This is what text extraction alone cannot give: a guaranteed acyclic graph, probabilities, and intervention answers."}}}</script>
<script>
const D = JSON.parse(document.getElementById("payload").textContent);
const STAGES = D.stages;
const REL_WORD = { direct: "directly causes", indirect: "causes (through something else)", collider: "has a common effect with", confounder: "has a common cause with" };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let state = { j: store.get("j", "j1"), s: store.get("s", 0), notes: store.get("notes", true), code: {}, q: null, cpd: null };
if (!D.journeys.find(j => j.id === state.j)) state.j = "j1";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const J = () => D.journeys.find(j => j.id === state.j);
const fmt = (v, d = 2) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);
const edgeKey = (a, b) => a + "→" + b;

/* ---------------- graph drawing ---------------- */
function drawGraph({ pos, directed = [], undirected = [], hl = [], newEdges = [], gone = [], okEdges = [], size = 240 }) {
  const R = 17, pad = 26, S = size;
  const P = n => [pad + (pos[n][0] + 1) / 2 * (S - 2 * pad), pad + (1 - (pos[n][1] + 1) / 2) * (S - 2 * pad)];
  const nk = new Set(newEdges.map(e => edgeKey(...e))), ok = new Set(okEdges.map(e => edgeKey(...e)));
  const line = (a, b, cls, arrow) => {
    const [x1, y1] = P(a), [x2, y2] = P(b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const sx = x1 + dx / L * R, sy = y1 + dy / L * R, ex = x2 - dx / L * (R + (arrow ? 2 : 0)), ey = y2 - dy / L * (R + (arrow ? 2 : 0));
    const m = arrow ? ` marker-end="url(#${cls.includes("new") ? "ar-new" : cls.includes("ok") ? "ar-ok" : "ar-ink"})"` : "";
    return `<line class="e ${cls}" x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"${m}/>`;
  };
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="causal graph">`;
  gone.forEach(([a, b]) => s += line(a, b, "gone", false));
  undirected.forEach(([a, b]) => s += line(a, b, "und", false));
  directed.forEach(([a, b]) => s += line(a, b, nk.has(edgeKey(a, b)) ? "new" : ok.has(edgeKey(a, b)) ? "ok" : "", true));
  Object.keys(pos).forEach(n => { const [x, y] = P(n);
    s += `<g class="node${hl.includes(n) ? " hl" : ""}"><circle cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y + 5}" text-anchor="middle">${n}</text></g>`; });
  return s + "</svg>";
}
const hlNodes = j => j.hyp ? [j.hyp.x, j.hyp.y] : [];

/* ---------------- code viewer ---------------- */
const KW = /\b(def|return|for|in|if|else|elif|not|and|or|import|from|as|class|None|True|False|lambda|while|raise|is|with|continue|break|print)\b/g;
function hl(line) {
  const re = /(#.*$)|((?:[rfbRF]{0,2})(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'))/g;
  let out = "", last = 0, m;
  const plain = t => esc(t).replace(KW, '<span class="tok-k">$1</span>');
  while ((m = re.exec(line))) { out += plain(line.slice(last, m.index));
    out += m[1] ? `<span class="tok-c">${esc(m[1])}</span>` : `<span class="tok-s">${esc(m[2])}</span>`; last = re.lastIndex; }
  return out + plain(line.slice(last));
}
function codeBlock(sn) {
  let rows = "";
  sn.lines.forEach((l, i) => { const note = sn.notes[String(i)];
    rows += `<tr class="${note ? "has" : ""}"><td class="ln">${sn.start + i}</td><td class="src">${hl(l) || " "}</td></tr>`;
    if (note && state.notes) rows += `<tr class="note"><td></td><td><div>${esc(note)}</div></td></tr>`; });
  return `<div class="codeinfo"><span class="where">${esc(sn.where)}${sn.where.endsWith(".ipynb") ? "" : " : line " + sn.start}</span>
    <label class="toggle"><input type="checkbox" class="notes-toggle" ${state.notes ? "checked" : ""}> line notes</label>
    <p class="sum">${esc(sn.summary)}</p></div><div class="code"><table>${rows}</table></div>`;
}
function codePanel(stage) {
  const list = D.stage_code[stage]; const cur = state.code[stage] ?? 0; const sn = list[Math.min(cur, list.length - 1)];
  const btns = list.map((s, i) => `<button data-code="${i}" aria-pressed="${i === cur}">${esc(s.title)}</button>`).join("");
  return `<div class="panel"><h3>The code that does it</h3><p class="muted" style="margin:0 0 10px;font-size:.86rem">Notebook cells call the functions from <code>src/causal_nlp</code>. Pick one; highlighted lines have a plain-English note under them.</p>
    <div class="codehead">${btns}</div>${codeBlock(sn)}</div>`;
}

/* ---------------- shared text panels ---------------- */
function textPanels(stage, storyItems) {
  const t = D.stage_text[stage];
  return `<div class="panel plain"><div class="eyebrow">In plain words</div><p>${esc(t.plain)}</p></div>
  <div class="panel story"><h3>What happens to this example</h3><ul>${storyItems.map(s => `<li>${s}</li>`).join("")}</ul>
    <details class="more"><summary>Technical version</summary><p>${esc(t.technical)}</p></details>
    <details class="more"><summary>Why this step exists</summary><p>${esc(t.why)}</p></details></div>`;
}

/* ---------------- stage renderers ---------------- */
const R = {};
R.load = j => {
  const [p, h] = j.input.split("\nHypothesis:");
  const story = [`This row comes from the <b>${j.split}</b> set and belongs to premise #${j.columns.premise_id}.`,
    `The answer key says: <b>${j.label ? "valid (1): the claim must be true" : "not valid (0): the story does not prove it"}</b>.`,
    `<code>split_input</code> cuts the text at “Hypothesis:” so later stages can treat the story and the claim separately.`];
  const vis = `<div class="panel"><h3>The raw row</h3><div class="raw">${esc(p)}\n<span class="hyp">Hypothesis:${esc(h)}</span></div>
    <div class="tbl-wrap" style="margin-top:10px"><table class="t"><tr><th>column</th><th>value</th></tr>
    <tr><td><code>premise</code></td><td>${esc(j.premise.slice(0, 90))}…</td></tr>
    <tr><td><code>hypothesis</code></td><td>${esc(j.hypothesis)}</td></tr>
    <tr><td><code>label</code></td><td class="num">${j.label}</td></tr>
    <tr><td><code>premise_id</code></td><td class="num">${j.columns.premise_id}</td></tr></table></div></div>`;
  return [textPanels("load", story) + vis];
};
R.parse = j => {
  const nc = j.sentences.filter(s => s.rule === "_CORR").length, ni = j.sentences.filter(s => s.rule && s.rule.includes("INDEP")).length;
  const hr = j.hyp_rule;
  const story = [`The reader found <b>${j.variables.length} variables</b> (${j.variables.join(", ")}), <b>${nc}</b> correlation sentences and <b>${ni}</b> independence sentences.`,
    hr.pattern_index === null
      ? `<b style="color:var(--bad)">The claim “${esc(j.hypothesis)}” matched none of the 5 known wordings</b>, so the reader returns <code>None</code>. The rest of the pipeline never sees this claim and the answer defaults to 0. This is the gap Phase 2 (DistilBERT) fills.`
      : `The claim matched wording #${hr.pattern_index + 1} and became <code>Hypothesis(relation='${hr.relation}', x='${hr.x}', y='${hr.y}')</code>: “${hr.x} ${REL_WORD[hr.relation]} ${hr.y}”.`,
    `Independence facts are stored as <b>separating sets</b> (“sepsets”): the sets of variables that, once known, make the pair unrelated. <code>{}</code> means unrelated with no condition.`];
  const rows = j.sentences.map(s => `<tr><td>${esc(s.text)}</td><td>${s.rule ? `<span class="chip">${s.rule}</span>` : `<span class="chip none">none</span>`}</td><td class="mono">${esc(s.fact)}</td></tr>`).join("");
  const seps = Object.entries(j.sepsets).map(([k, v]) => `<tr class="${v.length ? "" : "dim"}"><td class="num">${k}</td><td class="mono">${v.length ? v.join("  ") : "none (never independent)"}</td></tr>`).join("");
  const vis = `<div class="panel"><h3>Sentence by sentence</h3><div class="tbl-wrap"><table class="t"><tr><th>sentence</th><th>regex</th><th>fact written down</th></tr>${rows}
    <tr class="hl"><td><b>Hypothesis:</b> ${esc(j.hypothesis)}</td><td>${hr.pattern_index === null ? `<span class="chip none">no match</span>` : `<span class="chip">pattern ${hr.pattern_index + 1}</span>`}</td>
    <td class="mono">${hr.pattern_index === null ? "None" : `Hypothesis(${hr.relation}, ${hr.x}, ${hr.y})`}</td></tr></table></div></div>
    <div class="panel"><h3>The finished fact sheet: separating sets per pair</h3><div class="tbl-wrap"><table class="t"><tr><th>pair</th><th>separating sets</th></tr>${seps}</table></div></div>`;
  return [textPanels("parse", story) + vis];
};
R.skeleton = j => {
  const joined = j.skeleton_table.filter(r => r.joined), removed = j.skeleton_table.filter(r => !r.joined);
  const story = [`There are ${j.skeleton_table.length} pairs. <b>${joined.length}</b> have no separating set, so they stay joined: ${joined.map(r => r.pair[0] + "–" + r.pair[1]).join(", ") || "none"}.`,
    removed.length ? `<b>${removed.length}</b> are removed because something separates them, e.g. ${removed.slice(0, 3).map(r => `${r.pair} by ${r.sepsets[0]}`).join(", ")}.` : `No pair is ever separated, so every pair stays joined.`,
    `All lines are still dashed: we know <i>who</i> is linked, not <i>which way</i>.`];
  const rows = j.skeleton_table.map(r => `<tr class="${r.joined ? "hl" : ""}"><td class="num">${r.pair}</td><td>${r.correlated ? "yes" : "no"}</td><td class="mono">${r.sepsets.join(" ") || "—"}</td><td>${r.joined ? "<b>joined</b>" : "removed"}</td></tr>`).join("");
  const vis = `<div class="panel"><h3>Skeleton</h3><div class="graphs"><div class="gbox">${drawGraph({ pos: j.pos, undirected: j.skeleton.undirected, hl: hlNodes(j) })}<div class="cap">orange rings = the claim's two variables</div></div></div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="t"><tr><th>pair</th><th>correlated?</th><th>separating sets</th><th>result</th></tr>${rows}</table></div></div>`;
  return [textPanels("skeleton", story) + vis];
};
R.vstruct = j => {
  const cols = j.vstruct_table.filter(r => r.collider);
  const story = j.vstruct_table.length === 0 ? ["No pair is unjoined with a shared neighbour, so there is nothing to test."] : [
    `We test ${j.vstruct_table.length} shapes X – Z – Y where X and Y are not joined.`,
    cols.length ? `<b>${cols.length}</b> collider(s) found: ${cols.map(r => `${r.x} → ${r.z} ← ${r.y}`).join(", ")}. In each, Z never appears in X and Y's separating sets, so Z must be a common effect.` : "No colliders: every middle variable appears in a separating set.",
    ...j.vstruct_table.filter(r => !r.collider).slice(0, 2).map(r => `${r.z} is <b>not</b> a collider between ${r.x} and ${r.y}: it appears in their separating set ${r.z_in[0]}, so knowing ${r.z} cuts the link (a chain or common cause).`)];
  const rows = j.vstruct_table.map(r => `<tr class="${r.collider ? "hl" : ""}"><td class="num">${r.x} – ${r.z} – ${r.y}</td><td class="mono">${r.sepsets.join(" ")}</td><td>${r.z_in.length ? `yes, in ${r.z_in.join(" ")}` : "no"}</td><td>${r.collider ? `<b>${r.x} → ${r.z} ← ${r.y}</b>` : "not a collider"}</td></tr>`).join("");
  const newE = j.vstruct.directed;
  const vis = `<div class="panel"><h3>After step 2</h3><div class="graphs"><div class="gbox">${drawGraph({ pos: j.pos, directed: j.vstruct.directed, undirected: j.vstruct.undirected, hl: hlNodes(j), newEdges: newE })}</div></div>
    <div class="legend"><span class="l-new">arrow found in this step</span><span class="l-und">direction still unknown</span></div>
    ${j.vstruct_table.length ? `<div class="tbl-wrap" style="margin-top:8px"><table class="t"><tr><th>shape</th><th>X,Y separating sets</th><th>Z inside one?</th><th>result</th></tr>${rows}</table></div>` : ""}</div>`;
  return [textPanels("vstruct", story) + vis];
};
R.meek = j => {
  const st = j.meek_steps;
  const story = st.length ? [`<b>${st.length}</b> more arrow(s) follow by logic:`, ...st.map(s => `<b>${s.edge[0]} → ${s.edge[1]}</b> by rule ${s.rule}: ${esc(s.reason)}.`),
    j.meek.undirected.length ? `${j.meek.undirected.length} edge(s) stay dashed: the facts cannot decide them.` : `Every edge now has a direction: the facts pin down one single graph.`]
    : [`No Meek rule fires. The dashed edge(s) ${j.meek.undirected.map(e => e.join("–")).join(", ") || ""} could point either way without breaking any fact.`.replace(" ()", ""),
       j.meek.undirected.length ? `So the PC output (a <b>PDAG</b>) keeps them dashed. The next stage lists the possible worlds.` : `The graph is already fully directed.`];
  const vis = `<div class="panel"><h3>PC output (PDAG)</h3><div class="graphs"><div class="gbox">${drawGraph({ pos: j.pos, directed: j.meek.directed, undirected: j.meek.undirected, hl: hlNodes(j), newEdges: st.map(s => s.edge) })}</div></div>
    <div class="legend"><span>proven arrow</span><span class="l-new">added by a Meek rule</span><span class="l-und">undecided</span></div></div>`;
  return [textPanels("meek", story) + vis];
};
R.dags = j => {
  const kept = j.dags.filter(d => d.status === "kept"), k = j.meek.undirected.length;
  const holds = kept.filter(d => d.holds).length;
  const story = [k ? `${k} dashed edge(s) → 2<sup>${k}</sup> = ${2 ** k} ways to point them. <b>${kept.length}</b> fit the facts; ${2 ** k - kept.length} break a rule.` : `No dashed edges, so there is exactly one possible world.`,
    j.hyp ? `The claim “${j.hyp.x} ${REL_WORD[j.hyp.relation]} ${j.hyp.y}” is true in <b>${holds} of ${kept.length}</b> world(s), so <b>support = ${fmt(holds / kept.length)}</b>.` : `The claim was not understood at stage 1, so support is never computed.`,
    j.hyp ? (holds === kept.length ? `True in every world: the facts <b>prove</b> it.` : holds === 0 ? `True in no world: the facts rule it out.` : `True in some worlds only: it <b>might</b> be true, but the facts do not force it. Corr2Cause calls that not valid.`) : ""].filter(Boolean);
  const boxes = j.dags.map((d, i) => {
    const tag = d.status === "kept" ? (d.holds === null ? `<span class="pill">world ${i + 1}</span>` : d.holds ? `<span class="pill ok">claim true</span>` : `<span class="pill bad">claim false</span>`) : `<span class="pill">rejected</span>`;
    return `<div class="gbox small ${d.status}">${drawGraph({ pos: j.pos, directed: d.edges, hl: hlNodes(j), size: 200 })}${tag}<div class="cap">${d.status === "kept" ? "fits the facts" : esc(d.reason)}</div></div>`; }).join("");
  const vis = `<div class="panel"><h3>Every orientation of the dashed edges</h3><div class="graphs">${boxes}</div></div>`;
  return [textPanels("dags", story) + vis];
};
R.features = j => {
  if (!j.features) return [textPanels("features", ["The claim was not understood, so this row gets <code>parsed = 0</code> and no features at all. It will be predicted 0 (not valid) automatically."])];
  const f = j.features;
  const story = [`The claim becomes a row of ${Object.keys(f).length} numbers. Highlighted rows are the non-zero ones.`,
    `The most important number is <b>support = ${fmt(f.support)}</b>: the share of possible worlds where the claim holds.`,
    `No feature uses the letters themselves, so renaming A→Z would give the exact same row.`];
  const groups = Object.entries(D.feature_groups).map(([g, names]) => `<tr><th colspan="3" style="padding-top:12px">${g}</th></tr>` +
    names.map(n => `<tr class="${f[n] ? "hl" : "dim"}"><td><code>${n}</code></td><td class="num">${Number.isInteger(f[n]) ? f[n] : fmt(f[n])}</td><td>${esc(D.feature_meaning[n])}</td></tr>`).join("")).join("");
  return [textPanels("features", story) + `<div class="panel"><h3>The feature row</h3><div class="tbl-wrap"><table class="t">${groups}</table></div></div>`];
};
R.tree = j => {
  const nodes = D.tree.nodes, on = new Set(j.tree_path);
  const f = j.features;
  const walk = (id, branch) => { const n = nodes[id];
    const head = n.leaf ? `<span class="cond">leaf → P(valid) = ${fmt(n.p_valid, 3)} → predict ${n.p_valid >= 0.5 ? 1 : 0}</span>`
      : `<span class="cond">${n.feature} ≤ ${n.threshold} ?</span>`;
    const val = !n.leaf && f && on.has(id) ? ` <span class="pill trace">this example: ${Number.isInteger(f[n.feature]) ? f[n.feature] : fmt(f[n.feature])}</span>` : "";
    let s = `<div class="tnode${on.has(id) ? " on" : ""}"><div class="tq"><span class="br">${branch}</span>${head}${val}<span class="meta">${n.samples.toLocaleString()} training rows</span></div>`;
    if (!n.leaf) s += walk(n.left, "yes") + walk(n.right, "no");
    return s + "</div>"; };
  const right = j.prediction === j.label;
  const pathWords = j.tree_path.filter(id => !nodes[id].leaf).map((id, i) => { const n = nodes[id]; const v = f[n.feature]; const yes = v <= n.threshold;
    return `Is <code>${n.feature}</code> ≤ ${n.threshold}? It is ${Number.isInteger(v) ? v : fmt(v)}, so <b>${yes ? "yes" : "no"}</b>.`; });
  const story = j.features ? [...pathWords, `Landed in a leaf where ${fmt(j.p_valid * 100, 1)}% of training rows were valid → <b>predict ${j.prediction}</b>. Gold label is ${j.label}: <b style="color:var(--${right ? "ok" : "bad"})">${right ? "correct" : "wrong"}</b>.`]
    : [`No features, so the tree is never asked. <code>predict()</code> in notebook cell 20 fills unparsed rows with 0. Gold label is ${j.label}: <b style="color:var(--${right ? "ok" : "bad"})">${right ? "correct" : "wrong"}</b>.`];
  const vis = `<div class="panel"><div class="verdict"><div><div class="eyebrow">P(valid)</div><div class="big">${fmt(j.p_valid, 3)}</div></div>
    <div><div class="eyebrow">prediction</div><div class="big">${j.prediction}</div></div><div><div class="eyebrow">gold</div><div class="big">${j.label}</div></div>
    <span class="pill ${right ? "ok" : "bad"}">${right ? "correct" : "wrong"}</span></div></div>
    <div class="panel"><h3>The trained depth-4 tree (path of this example in orange)</h3><p class="muted" style="margin:0 0 8px;font-size:.84rem">“yes” = go left in scikit-learn's tree. Trained on 205,734 rows with the same settings as notebook cell 20.</p><div class="tree">${walk(0, "root")}</div></div>`;
  return [textPanels("tree", story) + vis];
};
R.graph = j => {
  const key = j.premise_key + ":" + (j.split === "paraphrase" ? "paraphrase" : "test");
  const G = D.graph_stage[key];
  const vars = j.variables;
  const gold = new Set(G.gold_edges.map(e => edgeKey(...e)));
  const pred = new Set(G.dag_edges.map(e => edgeKey(...e)));
  const missing = G.gold_edges.filter(e => !pred.has(edgeKey(...e)));
  if (!state.q || !G.queries[state.q]) state.q = Object.keys(G.queries).find(k => G.known[k] === true) || Object.keys(G.queries)[0];
  if (!state.cpd || !G.cpds[state.cpd]) state.cpd = vars.find(v => G.cpds[v].parents.length) || vars[0];
  const story = [`This stage looks at the <b>whole premise</b>: all ${G.n_hypotheses} claims about it, not just ours.`,
    j.split === "paraphrase" ? `In the paraphrased set the reader understood <b>${G.n_parsed} of ${G.n_hypotheses}</b> claims, so the tree accepted none and the graph is <b>empty</b>. Every what-if answer becomes “no effect”.`
      : `The tree accepted <b>${G.valid.length}</b> claims. The <b>${G.valid.filter(v => v.relation === "direct").length}</b> “directly causes” ones become arrows; the others (indirect, collider, confounder) summarise paths, so they are not drawn as single arrows.`,
    G.rejected.length ? `${G.rejected.length} arrow(s) refused because they would close a loop.` : `No arrow had to be refused for making a loop.`,
    missing.length ? `${missing.length} gold arrow(s) are missing from the predicted graph.` : `The predicted arrows match the gold arrows exactly.`,
    ...(() => { const unasked = j.meek.directed.filter(e => !pred.has(edgeKey(...e)) && !gold.has(edgeKey(...e)));
      return unasked.length && j.split !== "paraphrase" ? [`The PC graph also proves ${unasked.map(e => e.join(" → ")).join(", ")}, but the test set never asks “directly causes” about those pairs, so no claim exists to turn into an arrow. Only claims in the data reach this stage.`] : []; })(),
    `Each variable then gets a probability table (“noisy-OR”): on 10% of the time by itself; each active cause switches it on with 70% chance.`];
  const validRows = G.valid.map(v => `<tr><td>${esc(v.hypothesis)}</td><td class="num">${fmt(v.prob, 2)}</td><td class="num">${v.label}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">none</td></tr>`;
  const pos = j.pos;
  const cp = G.cpds[state.cpd];
  const cpdRows = cp.rows.map(r => `<tr><td class="mono">${cp.parents.length ? cp.parents.map(p => `${p}=${r.parents[p]}`).join(", ") : "(no causes)"}</td><td class="num">${fmt(r.p1, 3)}</td><td class="num">${fmt(1 - r.p1, 3)}</td></tr>`).join("");
  const cpdBtns = vars.map(v => `<button data-cpd="${v}" aria-pressed="${v === state.cpd}">${v}</button>`).join("");
  let mx = `<table class="matrix"><tr><th>force ↓ / watch →</th>${vars.map(v => `<th>${v}</th>`).join("")}</tr>`;
  vars.forEach(x => { mx += `<tr><th>${x}</th>`; vars.forEach(y => {
    if (x === y) { mx += `<td class="diag"></td>`; return; }
    const k = x + y, q = G.queries[k], g = G.known[k]; const miss = g !== undefined && g !== (q.ace > 0.01);
    const shade = Math.min(1, q.ace / 0.7);
    mx += `<td><button data-q="${k}" aria-pressed="${state.q === k}" class="${miss ? "miss" : ""}" style="background:color-mix(in srgb, var(--accent) ${Math.round(shade * 55)}%, var(--surface))">${fmt(q.ace, 2)}</button></td>`; });
    mx += "</tr>"; });
  mx += "</table>";
  const q = G.queries[state.q], g = G.known[state.q], [qx, qy] = state.q.split("");
  const said = q.ace > 0.01;
  const qExplain = q.ace > 0.01 && Math.abs(q.obs - q.ace) < 0.005 ? `Seeing and forcing agree: nothing else links ${qx} and ${qy}.`
    : q.ace <= 0.01 && q.obs > 0.01 ? `Seeing ${qx} on makes ${qy} more likely, but forcing ${qx} does nothing: ${qy} is a cause of ${qx} (or they share a cause), and forcing cuts ${qx} off from its causes.`
    : q.ace > 0.01 && q.obs > q.ace ? `Seeing overstates the effect: ${qx} and ${qy} share a cause, which seeing ${qx} also hints at.`
    : q.ace <= 0.01 ? `No arrow path from ${qx} to ${qy} in the graph, so forcing ${qx} cannot reach ${qy}.` : "";
  const vis = `<div class="panel"><h3>Accepted claims (P(valid) ≥ 0.5)</h3><div class="tbl-wrap"><table class="t"><tr><th>claim</th><th>P(valid)</th><th>gold</th></tr>${validRows}</table></div></div>
    <div class="panel"><h3>Predicted DAG vs gold arrows</h3><div class="graphs">
      <div class="gbox">${drawGraph({ pos, directed: G.dag_edges, hl: hlNodes(j), okEdges: G.dag_edges.filter(e => gold.has(edgeKey(...e))) })}<div class="cap">predicted (green = matches gold)</div></div>
      <div class="gbox">${drawGraph({ pos, directed: G.gold_edges, hl: hlNodes(j) })}<div class="cap">gold “directly causes” arrows</div></div></div></div>
    <div class="panel"><h3>Probability table (CPD) for one variable</h3><div class="codehead">${cpdBtns}</div>
      <div class="tbl-wrap"><table class="t"><tr><th>causes</th><th>P(${state.cpd} = 1)</th><th>P(${state.cpd} = 0)</th></tr>${cpdRows}</table></div></div>
    <div class="panel"><h3>What-if matrix: average causal effect of forcing the row variable on the column variable</h3>
      <p class="muted" style="margin:0 0 8px;font-size:.84rem">ACE = P(col = 1 | do(row = 1)) − P(col = 1 | do(row = 0)). Darker = bigger effect. Red outline = disagrees with a question whose true answer is known. Click a cell.</p>
      <div class="tbl-wrap">${mx}</div>
      <div class="qdetail"><b>Force ${qx}, watch ${qy}</b>
        <div class="barrow"><span>forcing: do(${qx})</span><div class="track"><div class="bar" style="width:${Math.max(0, q.ace) * 100}%"></div></div><span class="num">${fmt(q.ace, 3)}</span></div>
        <div class="barrow"><span>just seeing ${qx}</span><div class="track"><div class="bar obs" style="width:${Math.max(0, q.obs) * 100}%"></div></div><span class="num">${fmt(q.obs, 3)}</span></div>
        <div>${esc(qExplain)}</div>
        <div>${g === undefined ? `<span class="pill">true answer not fixed by the labels</span>` : `<span class="pill ${g === said ? "ok" : "bad"}">known answer: ${g ? "yes, it changes" : "no effect"} · network says ${said ? "yes" : "no"}</span>`}</div>
        ${g === true && !said ? `<div class="muted">This miss is a chain through an edge whose direction the correlations cannot reveal, so that edge is not in the DAG.</div>` : ""}
      </div></div>`;
  return [textPanels("graph", story) + vis];
};

/* ---------------- render ---------------- */
function renderJourneys() {
  $("journeys").innerHTML = D.journeys.map(j => { const right = j.prediction === j.label;
    return `<button class="jcard" data-j="${j.id}" aria-pressed="${j.id === state.j}"><span class="jt">${esc(j.title)}</span><span class="jh">“${esc(j.hypothesis)}”</span>
      <span class="pills"><span class="pill">gold ${j.label}</span><span class="pill ${right ? "ok" : "bad"}">${right ? "model right" : "model wrong"}</span>${j.split === "paraphrase" ? '<span class="pill trace">paraphrase</span>' : ""}</span></button>`; }).join("");
}
function render() {
  const j = J(); const stage = STAGES[state.s];
  renderJourneys();
  const right = j.prediction === j.label;
  $("claim").innerHTML = `<div><div class="eyebrow">Claim being traced · ${esc(j.split)} set · ${j.variables.length} variables</div><q>${esc(j.hypothesis)}</q><div class="sub">${esc(j.blurb)}</div></div>
    <div class="pills"><span class="pill acc">gold label ${j.label}</span><span class="pill trace">P(valid) ${fmt(j.p_valid, 2)}</span><span class="pill ${right ? "ok" : "bad"}">prediction ${j.prediction} · ${right ? "correct" : "wrong"}</span></div>`;
  const dead = !j.hyp;
  $("rail").innerHTML = STAGES.map((s, i) => `<button data-s="${i}" class="${i < state.s ? "done" : ""} ${dead && i > 1 && i < 8 && ["features", "tree"].includes(s) ? "dead" : ""}" ${i === state.s ? 'aria-current="step"' : ""}><span class="n">${i + 1} / ${STAGES.length}</span><span class="t">${esc(D.stage_text[s].name)}</span></button>`).join("");
  $("prev").disabled = state.s === 0; $("next").disabled = state.s === STAGES.length - 1;
  const [left] = R[stage](j);
  $("stage").innerHTML = `<div class="col">${left}</div><div class="col">${codePanel(stage)}</div>`;
  store.set("j", state.j); store.set("s", state.s);
}

/* ---------------- notebook view ---------------- */
const usedIn = {};
Object.entries(D.stage_code).forEach(([st, list]) => list.forEach(sn => { if (sn.id.startsWith("nb:")) (usedIn[sn.id] ??= []).push(D.stage_text[st].name); }));
function renderNotebook() {
  let toc = "", cells = "";
  D.notebook.forEach(c => {
    if (c.kind === "markdown") {
      const first = c.source.trim().split("\n")[0];
      const isHead = first.startsWith("#");
      if (isHead) toc += `<a class="sec" href="#cell-${c.cell}">${esc(first.replace(/^#+\s*/, ""))}</a>`;
      const rest = isHead ? c.source.trim().split("\n").slice(1).join("\n").trim() : c.source.trim();
      cells += `<div class="mdcell" id="cell-${c.cell}">${isHead ? `<h2>${esc(first.replace(/^#+\s*/, ""))}</h2>` : ""}${rest ? `<details><summary class="muted" style="cursor:pointer;font-size:.84rem">markdown cell ${c.cell}: show text</summary><pre>${esc(rest)}</pre></details>` : ""}</div>`;
    } else {
      const sn = c.snippet;
      toc += `<a href="#cell-${c.cell}">cell ${c.cell} · ${esc(sn.summary.split(":")[0].slice(0, 40))}</a>`;
      const used = usedIn["nb:" + c.cell];
      cells += `<div class="panel" id="cell-${c.cell}"><div class="cellhead"><span class="cn">In [${c.cell}]</span><h3>${esc(sn.summary)}</h3>${used ? `<span class="used">· traced in stage: ${used.map(esc).join(", ")}</span>` : ""}</div>${codeBlock(sn)}</div>`;
    }
  });
  $("toc").innerHTML = toc; $("cells").innerHTML = cells;
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.j) { state.j = b.dataset.j; state.q = null; state.cpd = null; render(); }
  else if (b.dataset.s !== undefined) { state.s = +b.dataset.s; render(); }
  else if (b.dataset.code !== undefined) { state.code[STAGES[state.s]] = +b.dataset.code; render(); }
  else if (b.dataset.q) { state.q = b.dataset.q; render(); }
  else if (b.dataset.cpd) { state.cpd = b.dataset.cpd; render(); }
  else if (b.id === "prev" && state.s > 0) { state.s--; render(); }
  else if (b.id === "next" && state.s < STAGES.length - 1) { state.s++; render(); }
  else if (b.id === "mode-trace" || b.id === "mode-nb") {
    const nb = b.id === "mode-nb"; $("trace-view").hidden = nb; $("nb-view").hidden = !nb;
    $("mode-trace").setAttribute("aria-pressed", !nb); $("mode-nb").setAttribute("aria-pressed", nb);
    if (nb) renderNotebook(); }
});
document.addEventListener("change", e => {
  if (e.target.classList.contains("notes-toggle")) { state.notes = e.target.checked; store.set("notes", state.notes); render(); if (!$("nb-view").hidden) renderNotebook(); }
});
document.addEventListener("keydown", e => {
  if (!$("nb-view").hidden || e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight" && state.s < STAGES.length - 1) { state.s++; render(); }
  if (e.key === "ArrowLeft" && state.s > 0) { state.s--; render(); }
});
render();
</script>

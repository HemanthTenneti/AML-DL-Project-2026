<title>Causal Pipeline Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: lab-manual tracer. A data point (amber) moves along a numbered stage rail; each stage pairs
   "what happened" (left) with the exact code that did it (right). */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --sunken: #f5f7fa;
  --ink: #17212c;
  --muted: #5b6977;
  --line: #d3dbe3;
  --accent: #1d5bb8;
  --accent-soft: #e3ecf9;
  --trace: #c96f06;
  --trace-soft: #fdf0dc;
  --ok: #1d7f47;
  --ok-soft: #e1f3e8;
  --bad: #b8322b;
  --bad-soft: #fbe5e3;
  --code-bg: #f7f9fb;
  --code-comment: #6b7a89;
  --code-string: #8a4b0b;
  --code-keyword: #1d5bb8;
  --note-bg: #fff8ea;
  --note-ink: #5a3d06;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --surface: #141c25; --sunken: #111820; --ink: #e2e9f0; --muted: #93a2b2; --line: #263342;
    --accent: #78aefc; --accent-soft: #1a2a40; --trace: #f2a742; --trace-soft: #33240f;
    --ok: #57c886; --ok-soft: #13301f; --bad: #ff7a70; --bad-soft: #3a1714;
    --code-bg: #10171f; --code-comment: #7d8d9d; --code-string: #f0b46b; --code-keyword: #8fbcff;
    --note-bg: #2a2010; --note-ink: #f3d9a8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #141c25; --sunken: #111820; --ink: #e2e9f0; --muted: #93a2b2; --line: #263342;
  --accent: #78aefc; --accent-soft: #1a2a40; --trace: #f2a742; --trace-soft: #33240f;
  --ok: #57c886; --ok-soft: #13301f; --bad: #ff7a70; --bad-soft: #3a1714;
  --code-bg: #10171f; --code-comment: #7d8d9d; --code-string: #f0b46b; --code-keyword: #8fbcff;
  --note-bg: #2a2010; --note-ink: #f3d9a8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; font-weight: 600; color: var(--muted); }

/* header */
header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
header.top p { margin: 6px 0 0; max-width: 62ch; color: var(--muted); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.modes button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font-weight: 500; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* journey picker */
.journeys { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 20px 0; }
.jcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 13px; display: grid; gap: 6px; align-content: start; }
.jcard:hover { border-color: var(--accent); }
.jcard[aria-pressed="true"] { border-color: var(--trace); box-shadow: 0 0 0 2px var(--trace) inset; }
.jcard .jt { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
.jcard .jh { font-size: 0.84rem; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.trace { background: var(--trace-soft); color: var(--trace); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* claim banner */
.claim { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.claim q { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; quotes: "“" "”"; }
.claim .sub { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

/* stage rail */
.rail { display: flex; gap: 0; margin: 18px 0 14px; overflow-x: auto; padding-bottom: 4px; }
.rail button { flex: 1 0 auto; min-width: 104px; border: 0; background: none; padding: 8px 6px 6px; text-align: left; border-top: 3px solid var(--line); display: grid; gap: 2px; }
.rail button .n { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.rail button .t { font-size: 0.85rem; font-weight: 500; line-height: 1.2; }
.rail button.done { border-top-color: var(--accent); }
.rail button[aria-current="step"] { border-top-color: var(--trace); }
.rail button[aria-current="step"] .t { color: var(--trace); font-weight: 600; }
.rail button.dead { border-top-style: dashed; opacity: 0.55; }
.stepnav { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 0.88rem; }
.btn:hover { border-color: var(--accent); }
.btn[disabled] { opacity: 0.4; cursor: default; }

/* stage body */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1080px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.panel > h3 { margin-bottom: 8px; }
.plain { background: var(--trace-soft); border-color: transparent; }
.plain p { margin: 4px 0 0; max-width: 72ch; }
.story { border-left: 3px solid var(--trace); }
.story ul { margin: 6px 0 0; padding-left: 18px; }
.story li { margin: 3px 0; }
details.more { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
details.more summary { cursor: pointer; font-weight: 500; color: var(--accent); }
details.more p { margin: 6px 0; max-width: 72ch; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.t th { text-align: left; font-weight: 600; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.hl td { background: var(--trace-soft); }
table.t tr.dim td { color: var(--muted); }
.chip { font-family: var(--font-mono); font-size: 0.74rem; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.none { background: var(--bad-soft); color: var(--bad); }

/* raw text */
.raw { font-family: var(--font-mono); font-size: 0.82rem; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
.raw .hyp { color: var(--trace); font-weight: 500; }

/* graphs */
.graphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.gbox { display: grid; gap: 4px; justify-items: center; text-align: center; }
.gbox svg { width: 100%; max-width: 280px; height: auto; }
.gbox.small svg { max-width: 170px; }
.gbox .cap { font-size: 0.8rem; color: var(--muted); }
.gbox.rejected svg { opacity: 0.45; }
svg .node circle { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
svg .node.hl circle { fill: var(--trace-soft); stroke: var(--trace); stroke-width: 2.6; }
svg .node text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 15px; }
svg .e { stroke: var(--ink); stroke-width: 2; fill: none; }
svg .e.und { stroke: var(--muted); stroke-dasharray: 5 4; }
svg .e.new { stroke: var(--trace); stroke-width: 2.6; }
svg .e.gone { stroke: var(--bad); stroke-dasharray: 2 4; opacity: 0.6; }
svg .e.ok { stroke: var(--ok); }
marker#ar-ink path { fill: var(--ink); }
marker#ar-new path { fill: var(--trace); }
marker#ar-ok path { fill: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 2px solid var(--ink); }
.legend .l-und::before { border-top: 2px dashed var(--muted); }
.legend .l-new::before { border-top: 3px solid var(--trace); }
.legend .l-gone::before { border-top: 2px dotted var(--bad); }

/* tree */
.tree { font-size: 0.86rem; display: grid; gap: 4px; }
.tnode { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
.tq { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 4px 8px; border-radius: 6px; }
.tq .br { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); min-width: 34px; }
.tq .cond { font-family: var(--font-mono); }
.tq .meta { font-size: 0.76rem; color: var(--muted); }
.tnode.on > .tq { background: var(--trace-soft); }
.tnode.on { border-left-color: var(--trace); }
.tnode.on > .tq .cond { color: var(--trace); font-weight: 500; }
.verdict { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 14px; border-radius: 6px; background: var(--sunken); }
.verdict .big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* do-query matrix */
.matrix { border-collapse: collapse; font-size: 0.82rem; }
.matrix th { font-family: var(--font-display); padding: 4px 6px; color: var(--muted); font-weight: 600; }
.matrix td { padding: 0; }
.matrix button { width: 58px; height: 38px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.matrix button[aria-pressed="true"] { outline: 2px solid var(--trace); outline-offset: -2px; }
.matrix button.miss { box-shadow: inset 0 0 0 2px var(--bad); }
.matrix td.diag { background: var(--sunken); }
.qdetail { margin-top: 10px; display: grid; gap: 6px; font-size: 0.9rem; }
.bar { height: 10px; border-radius: 3px; background: var(--accent); }
.bar.obs { background: var(--muted); }
.barrow { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px; align-items: center; font-size: 0.85rem; }
.barrow .num { font-family: var(--font-mono); text-align: right; }
.track { background: var(--sunken); border-radius: 3px; }

/* code viewer */
.codehead { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.codehead button { border: 1px solid var(--line); background: var(--sunken); border-radius: 6px; padding: 4px 9px; font-family: var(--font-mono); font-size: 0.76rem; }
.codehead button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.codeinfo { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.codeinfo .where { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.codeinfo .sum { font-size: 0.9rem; margin: 0; flex-basis: 100%; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.code { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; }
.code table { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.5; }
.code td.ln { width: 1%; text-align: right; color: var(--muted); padding: 0 10px 0 10px; user-select: none; vertical-align: top; opacity: 0.7; }
.code td.src { white-space: pre; padding: 0 12px 0 0; }
.code tr.has td.src { background: color-mix(in srgb, var(--trace-soft) 55%, transparent); }
.code tr.note td { padding: 0; }
.code tr.note div { white-space: normal; font-family: var(--font-body); font-size: 0.8rem; line-height: 1.45; background: var(--note-bg); color: var(--note-ink); border-left: 3px solid var(--trace); margin: 1px 10px 4px 0; padding: 4px 10px; border-radius: 0 4px 4px 0; }
.tok-c { color: var(--code-comment); font-style: italic; }
.tok-s { color: var(--code-string); }
.tok-k { color: var(--code-keyword); font-weight: 500; }

/* notebook mode */
.nb { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; margin-top: 20px; align-items: start; }
@media (max-width: 900px) { .nb { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow-y: auto; font-size: 0.84rem; display: grid; gap: 2px; }
.toc a { color: var(--muted); text-decoration: none; padding: 3px 8px; border-radius: 4px; display: block; }
.toc a:hover { color: var(--ink); background: var(--surface); }
.toc a.sec { color: var(--ink); font-weight: 600; margin-top: 8px; }
.cells { display: grid; gap: 14px; min-width: 0; }
.mdcell { padding: 4px 2px; }
.mdcell h2 { margin: 18px 0 6px; }
.mdcell pre { white-space: pre-wrap; font-family: var(--font-body); font-size: 0.88rem; color: var(--muted); margin: 0; max-width: 80ch; }
.cellhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 8px; }
.cellhead .cn { font-family: var(--font-mono); font-size: 0.78rem; color: var(--trace); font-weight: 500; }
.used { font-size: 0.78rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .stage { animation: fade 0.18s ease-out; } @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Phase 1 · Corr2Cause · neuro-symbolic pipeline</div>
      <h1>Causal Pipeline Tracer</h1>
      <p>Pick a real test example and follow it through all nine stages. Every number on this page was produced by the project's own code, and the code shown is copied from the real files.</p>
    </div>
    <div class="modes" role="group" aria-label="View">
      <button id="mode-trace" aria-pressed="true">Trace a data point</button>
      <button id="mode-nb" aria-pressed="false">Notebook, cell by cell</button>
    </div>
  </header>

  <main id="trace-view">
    <div class="journeys" id="journeys"></div>
    <div class="claim" id="claim"></div>
    <nav class="rail" id="rail" aria-label="Pipeline stages"></nav>
    <div class="stepnav">
      <button class="btn" id="prev">← Previous stage</button>
      <span class="muted" style="font-size:.84rem">Arrow keys also move between stages</span>
      <button class="btn" id="next">Next stage →</button>
    </div>
    <section class="stage" id="stage"></section>
  </main>

  <main id="nb-view" hidden>
    <div class="nb">
      <nav class="toc" id="toc" aria-label="Notebook cells"></nav>
      <div class="cells" id="cells"></div>
    </div>
  </main>
</div>

r>/<file>.","2":"Only download if we do not have it yet.","3":"Make the folder if needed.","4":"Fetch the file from the Hugging Face dataset repository and copy it here.","5":"Give back the local path."},"summary":"Download a CSV from Hugging Face once, then reuse the local copy."}],"parse":[{"id":"nb:9","title":"Notebook cell 9","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["# Pick a test premise whose graph has both oriented and unoriented edges (a good teaching example)","def mixed(p):","    g = pc_from_premise(parse_premise(p))","    return len(g.nodes) <= 5 and g.directed and g.undirected","text = next(p for p in data[\"test\"].premise.unique() if mixed(p))","facts = parse_premise(text)","print(text, \"\\n\")","print(\"variables  :\", facts.variables)","print(\"correlated :\", sorted(\"\".join(sorted(p)) for p in facts.correlated))","print(\"independent:\", {\"\".join(sorted(p)): [\"{\" + \",\".join(sorted(s)) + \"}\" for s in sets]","                       for p, sets in facts.sepsets.items() if sets})","print(\"\\nhypothesis :\", parse_hypothesis(\"There exists at least one collider (i.e., common effect) of A and C.\"))"],"notes":{"1":"Helper: does this premise make a graph with BOTH proven arrows and undecided (dashed) edges?","2":"Read the premise, then run the PC algorithm on it.","3":"Keep it small (\u2264 5 variables) and require both edge types.","4":"Take the first test premise that passes the check.","5":"Stage 1: sentences \u2192 Premise object (variables, correlated pairs, sepsets).","7":"The variable names from the header sentence.","8":"Pairs the text says are correlated, written as 'AC' etc.","9":"For each pair: every set of variables that makes the pair independent ({} = no condition).","11":"Parse one example hypothesis into Hypothesis(relation, x, y)."},"summary":"Stage 1 demo: pick a teaching premise and show the facts the regex reader extracts from it."},{"id":"blk:parsing:DIRECT, INDIRECT, COLLIDER, CONFOUNDER =|VAR = r","title":"relation names + variable pattern","where":"src/causal_nlp/parsing.py","start":14,"lines":["DIRECT, INDIRECT, COLLIDER, CONFOUNDER = \"direct\", \"indirect\", \"collider\", \"confounder\"","RELATIONS = (DIRECT, INDIRECT, COLLIDER, CONFOUNDER)","","VAR = r\"([A-Z])\"  # variables are single capital letters (A..F, or V..Z after refactoring)"],"notes":{"0":"The four kinds of causal claim the system understands.","1":"The same four, as a list to loop over.","3":"Regex for a variable: exactly one capital letter, captured in a group so we can read it."},"summary":"Our small vocabulary: four relation types, and what a variable looks like."},{"id":"blk:parsing:_HEADER = re.compile|_COND_INDEP = re.compile","title":"premise sentence patterns","where":"src/causal_nlp/parsing.py","start":38,"lines":["_HEADER = re.compile(r\"closed system of (\\d+) variables?, (.+?)\\. All the statistical\")","_CORR = re.compile(rf\"{VAR} correlates with {VAR}\\.\")","_MARG_INDEP = re.compile(rf\"{VAR} is independent of {VAR}\\.\")","_COND_INDEP = re.compile(rf\"{VAR} and {VAR} are independent given ([A-Z ,and]+?)\\.\")"],"notes":{"0":"Reads 'closed system of N variables, A, B and C.' \u2192 captures N and the list of names.","1":"Reads 'X correlates with Y.' \u2192 captures X and Y.","2":"Reads 'X is independent of Y.' \u2192 independent with no condition.","3":"Reads 'X and Y are independent given \u2026' \u2192 captures X, Y and the conditioning list."},"summary":"One regex per sentence shape in the premise."},{"id":"py:parsing.parse_premise","title":"parse_premise()","where":"src/causal_nlp/parsing.py","start":49,"lines":["def parse_premise(text: str) -> Premise:","    header = _HEADER.search(text)","    if header is None:","        raise ValueError(f\"Unrecognised premise: {text[:80]}...\")","    n_vars, var_list = int(header.group(1)), _split_var_list(header.group(2))","    if len(var_list) != n_vars:","        raise ValueError(f\"Expected {n_vars} variables, found {var_list}\")","","    premise = Premise(variables=var_list)","    premise.sepsets = {pair: [] for pair in premise.pairs()}","    body = text[header.end():]","","    for a, b in _CORR.findall(body):","        premise.correlated.add(frozenset((a, b)))","    for a, b in _MARG_INDEP.findall(body):","        premise.sepsets[frozenset((a, b))].append(frozenset())","    for a, b, given in _COND_INDEP.findall(body):","        premise.sepsets[frozenset((a, b))].append(frozenset(_split_var_list(given)))","    return premise"],"notes":{"1":"Find the header sentence.","2":"If it is missing, this is not a Corr2Cause premise: stop with a clear error.","4":"Number of variables, and their names.","5":"Sanity check: the count must match the names found.","8":"Start an empty fact sheet.","9":"Every pair starts with an empty list of separating sets (= never independent).","10":"The text after the header holds the facts.","12":"Every 'X correlates with Y' \u2026","13":"\u2026 is stored as an unordered pair {X, Y}.","14":"Every 'X is independent of Y' \u2026","15":"\u2026 adds the empty set {} to that pair's separating sets.","16":"Every 'X and Y are independent given S' \u2026","17":"\u2026 adds S to that pair's separating sets.","18":"The finished fact sheet."},"summary":"Turn the whole premise paragraph into a Premise object of facts."},{"id":"py:parsing._split_var_list","title":"_split_var_list()","where":"src/causal_nlp/parsing.py","start":44,"lines":["def _split_var_list(text: str) -> list[str]:","    \"\"\"'A, B, C and D' -> ['A', 'B', 'C', 'D']\"\"\"","    return re.findall(r\"\\b[A-Z]\\b\", text)"],"notes":{"2":"\\b\u2026\\b = whole word, so only standalone capital letters are taken."},"summary":"Pull single capital letters out of a phrase like 'A, B and C'."},{"id":"blk:parsing:HYPOTHESIS_PATTERNS = [|]","title":"HYPOTHESIS_PATTERNS","where":"src/causal_nlp/parsing.py","start":72,"lines":["HYPOTHESIS_PATTERNS = [","    (re.compile(rf\"^{VAR} directly causes {VAR}\\.$\"), DIRECT, 1, 2),","    (re.compile(rf\"^{VAR} causes something else which causes {VAR}\\.$\"), INDIRECT, 1, 2),","    (re.compile(rf\"^{VAR} is a cause for {VAR}, but not a direct one\\.$\"), INDIRECT, 1, 2),","    (re.compile(rf\"^There exists at least one collider \\(i\\.e\\., common effect\\) of {VAR} and {VAR}\\.$\"), COLLIDER, 1, 2),","    (re.compile(rf\"^There exists at least one confounder \\(i\\.e\\., common cause\\) of {VAR} and {VAR}\\.$\"), CONFOUNDER, 1, 2),","]"],"notes":{"0":"Each entry: (regex, relation, which captured letter is x, which is y).","1":"'X directly causes Y.' \u2192 direct.","2":"'X causes something else which causes Y.' \u2192 indirect.","3":"'X is a cause for Y, but not a direct one.' \u2192 indirect too.","4":"'There exists at least one collider \u2026 of X and Y.' \u2192 collider.","5":"'There exists at least one confounder \u2026 of X and Y.' \u2192 confounder."},"summary":"The five hypothesis wordings the reader knows, each mapped to a relation type."},{"id":"py:parsing.parse_hypothesis","title":"parse_hypothesis()","where":"src/causal_nlp/parsing.py","start":81,"lines":["def parse_hypothesis(text: str) -> Hypothesis | None:","    \"\"\"Return the structured hypothesis, or None if no rule matches (unseen phrasing).\"\"\"","    text = text.strip()","    for pattern, relation, gx, gy in HYPOTHESIS_PATTERNS:","        m = pattern.match(text)","        if m:","            return Hypothesis(relation, m.group(gx), m.group(gy))","    return None"],"notes":{"2":"Remove stray spaces.","3":"Try each known wording in turn.","4":"Does the whole sentence fit this pattern?","6":"Yes: return the relation and the two variables.","7":"No pattern fits (a new wording): return None. Phase 2 replaces this function with DistilBERT."},"summary":"Turn the hypothesis sentence into Hypothesis(relation, x, y), or None."},{"id":"py:parsing.Premise","title":"Premise","where":"src/causal_nlp/parsing.py","start":27,"lines":["@dataclass","class Premise:","    variables: list[str]","    correlated: set[frozenset] = field(default_factory=set)      # marginally dependent pairs","    sepsets: dict[frozenset, list[frozenset]] = field(default_factory=dict)  # pair -> sets S with X _||_ Y | S","","    def pairs(self):","        return [frozenset(p) for p in combinations(self.variables, 2)]"],"notes":{"2":"Variable names, e.g. ['A', 'B', 'C'].","3":"Pairs that are correlated. frozenset = unordered, so {A, C} = {C, A}.","4":"For each pair, every set of variables that makes the pair independent.","6":"All unordered pairs of variables."},"summary":"The fact sheet that stage 1 fills in."},{"id":"nb:11","title":"Notebook cell 11","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["coverage = {name: df.hypothesis.map(lambda h: parse_hypothesis(h) is not None).mean()","            for name, df in data.items() if name != \"train\"}","pd.Series(coverage, name=\"hypotheses parsed\").map(\"{:.0%}\".format).to_frame()"],"notes":{"0":"For each set: share of hypotheses where parse_hypothesis returns something (not None).","1":"Skip train (it is all template text anyway).","2":"Show as percentages. Paraphrase = 0%: the reader knows none of the new wordings."},"summary":"How much text can the regex reader understand in each test set?"}],"skeleton":[{"id":"py:causal_rules.skeleton","title":"skeleton()","where":"src/causal_nlp/causal_rules.py","start":49,"lines":["def skeleton(premise: Premise) -> PDAG:","    pdag = PDAG(nodes=list(premise.variables))","    for pair in premise.pairs():","        if not premise.sepsets[pair]:  # never independent -> direct link","            pdag.undirected.add(pair)","    return pdag"],"notes":{"1":"Start with the variables and no edges.","2":"Look at every pair once.","3":"No separating set at all \u2192 the pair is never independent \u2192 directly linked.","4":"Add a dashed (direction unknown) edge.","5":"The skeleton."},"summary":"PC step 1: join every pair that nothing can make independent."},{"id":"py:causal_rules.PDAG","title":"PDAG","where":"src/causal_nlp/causal_rules.py","start":25,"lines":["@dataclass","class PDAG:","    nodes: list[str]","    directed: set[tuple[str, str]] = field(default_factory=set)  # (a, b) means a -> b","    undirected: set[frozenset] = field(default_factory=set)      # {a, b} means a - b","","    def adjacent(self, a: str, b: str) -> bool:","        return (a, b) in self.directed or (b, a) in self.directed or frozenset((a, b)) in self.undirected","","    def neighbours(self, a: str) -> set[str]:","        return {b for b in self.nodes if b != a and self.adjacent(a, b)}","","    def parents(self, a: str) -> set[str]:","        return {p for p, c in self.directed if c == a}","","    def children(self, a: str) -> set[str]:","        return {c for p, c in self.directed if p == a}","","    def orient(self, a: str, b: str) -> None:","        \"\"\"Turn the undirected edge a - b into a -> b.\"\"\"","        self.undirected.discard(frozenset((a, b)))","        self.directed.add((a, b))"],"notes":{"2":"The variables.","3":"Proven arrows, stored as (a, b) meaning a \u2192 b.","4":"Undecided edges, stored as {a, b}.","6":"Are a and b joined at all, by an arrow either way or a dashed edge?","9":"Everything joined to a.","12":"Proven causes of a (arrows into a).","15":"Proven effects of a (arrows out of a).","18":"Turn the dashed edge a \u2013 b into the arrow a \u2192 b."},"summary":"A partly directed graph: some arrows known, some edges undecided."}],"vstruct":[{"id":"py:causal_rules.orient_v_structures","title":"orient_v_structures()","where":"src/causal_nlp/causal_rules.py","start":57,"lines":["def orient_v_structures(pdag: PDAG, premise: Premise) -> PDAG:","    for x, y in combinations(pdag.nodes, 2):","        if pdag.adjacent(x, y):","            continue","        sepsets = premise.sepsets[frozenset((x, y))]","        for z in pdag.neighbours(x) & pdag.neighbours(y):","            if all(z not in s for s in sepsets):","                pdag.orient(x, z)","                pdag.orient(y, z)","    return pdag"],"notes":{"1":"Look at every pair X, Y \u2026","2":"\u2026 but only pairs that are NOT joined (skip joined ones).","4":"The sets that separate X and Y.","5":"Every Z joined to both: the shape X \u2013 Z \u2013 Y.","6":"Z is in NONE of the separating sets \u2192 knowing Z does not separate X and Y \u2192 Z is a common effect.","7":"Draw X \u2192 Z \u2026","8":"\u2026 and Y \u2192 Z."},"summary":"PC step 2: find common effects (colliders) and draw their arrows."}],"meek":[{"id":"py:causal_rules.apply_meek_rules","title":"apply_meek_rules()","where":"src/causal_nlp/causal_rules.py","start":69,"lines":["def apply_meek_rules(pdag: PDAG) -> PDAG:","    changed = True","    while changed:","        changed = False","        for edge in list(pdag.undirected):","            a, b = tuple(edge)","            for u, v in ((a, b), (b, a)):","                if frozenset((u, v)) not in pdag.undirected:","                    break","                if _forced(pdag, u, v):","                    pdag.orient(u, v)","                    changed = True","    return pdag"],"notes":{"1":"Repeat while something changed in the last pass.","4":"Look at every still-undecided edge.","6":"Try both directions, u \u2192 v and v \u2192 u.","7":"Stop if the edge was already oriented a moment ago.","9":"Does a Meek rule force u \u2192 v?","10":"Yes: draw the arrow and note that something changed."},"summary":"PC step 3: keep applying the Meek rules until no edge changes."},{"id":"py:causal_rules._forced","title":"_forced()","where":"src/causal_nlp/causal_rules.py","start":84,"lines":["def _forced(pdag: PDAG, u: str, v: str) -> bool:","    \"\"\"Is the undirected edge u - v forced to be u -> v by Meek rules R1-R3?\"\"\"","    # R1: w -> u - v with w, v not adjacent   =>  u -> v   (else new v-structure at u)","    if any(not pdag.adjacent(w, v) for w in pdag.parents(u) if w != v):","        return True","    # R2: u -> w -> v and u - v               =>  u -> v   (else a cycle)","    if pdag.children(u) & pdag.parents(v):","        return True","    # R3: u - w1 -> v, u - w2 -> v, w1, w2 not adjacent  =>  u -> v","    undirected_nbrs = {w for w in pdag.nodes if frozenset((u, w)) in pdag.undirected}","    candidates = sorted(undirected_nbrs & pdag.parents(v))","    return any(not pdag.adjacent(w1, w2) for w1, w2 in combinations(candidates, 2))"],"notes":{"2":"Rule 1: some W \u2192 U, W not joined to V. If V pointed into U we would get a new collider W \u2192 U \u2190 V, which the facts did not show, so U \u2192 V.","3":"Check rule 1 for every parent W of U.","5":"Rule 2: there is already U \u2192 W \u2192 V. Then V \u2192 U would make a loop, so U \u2192 V.","6":"Is there a W that U points to and that points to V?","8":"Rule 3: U is dashed-joined to two unjoined W1, W2 that both point to V. Then U \u2192 V (the other way creates a loop or a collider).","9":"Variables joined to U by a dashed edge.","10":"Those that also point into V.","11":"Rule 3 fires if two of them are not joined to each other."},"summary":"Checks the three Meek rules for one edge u \u2013 v."},{"id":"py:causal_rules.pc_from_premise","title":"pc_from_premise()","where":"src/causal_nlp/causal_rules.py","start":98,"lines":["def pc_from_premise(premise: Premise) -> PDAG:","    \"\"\"Run all three PC steps on the extracted (in)dependence facts.\"\"\"","    return apply_meek_rules(orient_v_structures(skeleton(premise), premise))"],"notes":{"2":"skeleton \u2192 v-structures \u2192 Meek rules, applied inside-out."},"summary":"The whole PC algorithm in one line: step 1, then 2, then 3."}],"dags":[{"id":"py:causal_rules.equivalent_dags","title":"equivalent_dags()","where":"src/causal_nlp/causal_rules.py","start":113,"lines":["def equivalent_dags(pdag: PDAG) -> list[nx.DiGraph]:","    \"\"\"All DAGs the PDAG stands for: try both directions for every undirected edge,","    keep those with no cycle and no extra v-structure (they fit the facts equally well).\"\"\"","    undirected = [tuple(sorted(e)) for e in pdag.undirected]","    base = nx.DiGraph(list(pdag.directed))","    base.add_nodes_from(pdag.nodes)","    adjacency = base.to_undirected()","    adjacency.add_edges_from(undirected)","    required = _v_structures(base, adjacency)","","    dags = []","    for flips in product((False, True), repeat=len(undirected)):","        dag = base.copy()","        dag.add_edges_from((b, a) if flip else (a, b) for (a, b), flip in zip(undirected, flips))","        if nx.is_directed_acyclic_graph(dag) and _v_structures(dag, adjacency) == required:","            dags.append(dag)","    return dags"],"notes":{"3":"The dashed edges, as (a, b) pairs.","4":"Start from the proven arrows only.","6":"Who is joined to whom (direction ignored), dashed edges included.","8":"The colliders the facts showed. Every world must have exactly these.","11":"Every combination of directions: 2 \u00d7 2 \u00d7 \u2026 for each dashed edge.","12":"Copy the proven arrows,","13":"then point each dashed edge one way or the other.","14":"Keep the world only if it has no loop and no extra collider.","16":"All the possible worlds."},"summary":"List every possible world: each way to point the dashed edges that still fits the facts."},{"id":"py:causal_rules._v_structures","title":"_v_structures()","where":"src/causal_nlp/causal_rules.py","start":104,"lines":["def _v_structures(dag: nx.DiGraph, adjacency: nx.Graph) -> set[tuple[str, str, str]]:","    found = set()","    for z in dag.nodes:","        for a, b in combinations(sorted(dag.predecessors(z)), 2):","            if not adjacency.has_edge(a, b):","                found.add((a, z, b))","    return found"],"notes":{"2":"For every variable Z \u2026","3":"\u2026 every pair of arrows into Z \u2026","4":"\u2026 whose tails A, B are not joined \u2026","5":"\u2026 is a collider. Record it."},"summary":"List all colliders A \u2192 Z \u2190 B where A and B are not joined."},{"id":"py:causal_rules.relation_holds","title":"relation_holds()","where":"src/causal_nlp/causal_rules.py","start":139,"lines":["def relation_holds(dag: nx.DiGraph, relation: str, x: str, y: str) -> bool:","    if relation == DIRECT:      # X -> Y","        return dag.has_edge(x, y)","    if relation == INDIRECT:    # X -> Z -> ... -> Y  (through at least one mediator)","        return any(nx.has_path(dag, z, y) for z in dag.successors(x) if z != y)","    if relation == COLLIDER:    # X -> ... -> Z <- ... <- Y  (a common effect)","        return bool(_reachable_avoiding(dag, x, y) & _reachable_avoiding(dag, y, x))","    if relation == CONFOUNDER:  # X <- ... <- Z -> ... -> Y  (a common cause)","        return bool(_reachable_avoiding(dag, x, y, reverse=True) & _reachable_avoiding(dag, y, x, reverse=True))","    raise ValueError(relation)"],"notes":{"1":"direct: is there an arrow X \u2192 Y?","3":"indirect: does X point to some Z (not Y) from which Y can be reached?","5":"collider: is there a Z reachable from X (without passing Y) AND from Y (without passing X)? That Z is a common effect.","7":"confounder: is there a Z that reaches X (not via Y) AND reaches Y (not via X)? That Z is a common cause.","9":"Unknown relation name: stop with an error."},"summary":"Is a claim true in ONE particular world (DAG)?"},{"id":"py:causal_rules._reachable_avoiding","title":"_reachable_avoiding()","where":"src/causal_nlp/causal_rules.py","start":133,"lines":["def _reachable_avoiding(dag: nx.DiGraph, start: str, avoid: str, reverse: bool = False) -> set[str]:","    \"\"\"Descendants (or ancestors) of `start` along paths that do not pass through `avoid`.\"\"\"","    view = nx.subgraph_view(dag, filter_node=lambda n: n != avoid)","    return nx.ancestors(view, start) if reverse else nx.descendants(view, start)"],"notes":{"2":"A view of the graph with the 'avoid' variable hidden.","3":"Going backwards (causes of causes) or forwards (effects of effects)."},"summary":"Who can be reached from a variable without passing through another one."},{"id":"py:causal_rules.support","title":"support()","where":"src/causal_nlp/causal_rules.py","start":151,"lines":["def support(dags: list[nx.DiGraph], relation: str, x: str, y: str) -> float:","    \"\"\"Fraction of equivalent DAGs in which the relation holds (1.0 = certain).\"\"\"","    return sum(relation_holds(d, relation, x, y) for d in dags) / len(dags)"],"notes":{"2":"Count worlds where it holds (True counts as 1) and divide by the number of worlds."},"summary":"Share of possible worlds in which the claim is true."},{"id":"nb:14","title":"Notebook cell 14","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["def draw_pdag(pdag, ax, title):","    g = nx.DiGraph(); g.add_nodes_from(pdag.nodes)","    pos = nx.circular_layout(sorted(pdag.nodes))","    nx.draw_networkx_nodes(g, pos, ax=ax, node_color=\"#dbe9f6\", node_size=900, edgecolors=\"#2b6cb0\")","    nx.draw_networkx_labels(g, pos, ax=ax, font_weight=\"bold\")","    nx.draw_networkx_edges(g, pos, edgelist=list(pdag.directed), ax=ax, arrowsize=20, width=2, node_size=900)","    nx.draw_networkx_edges(g.to_undirected(), pos, edgelist=[tuple(e) for e in pdag.undirected],","                           ax=ax, style=\"dashed\", width=2, edge_color=\"gray\")","    ax.set_title(title); ax.axis(\"off\")","","pdag = pc_from_premise(facts)","dags = equivalent_dags(pdag)","fig, ax = plt.subplots(figsize=(4.5, 4))","draw_pdag(pdag, ax, f\"PDAG from the premise above\\n({len(dags)} equivalent DAG(s))\")","plt.show()","","(a, b), (c, d) = sorted(pdag.directed)[0], sorted(tuple(sorted(e)) for e in pdag.undirected)[0]","for rel, x, y in [(\"direct\", a, b), (\"direct\", c, d), (\"direct\", d, c), (\"indirect\", d, b)]:","    print(f\"support({rel:8s}, {x}, {y}) = {support(dags, rel, x, y):.2f}\")"],"notes":{"0":"Helper that draws a PDAG: solid arrows = proven, dashed lines = undecided.","1":"Empty directed graph holding just the nodes, so networkx can place them.","2":"Put the variables on a circle (sorted, so A is always in the same place).","3":"Draw the circles.","4":"Write the letters inside.","5":"Draw proven arrows.","6":"Draw the undecided edges as grey dashed lines (no arrow heads).","8":"Add the title and hide the axes.","10":"Run PC (skeleton \u2192 v-structures \u2192 Meek) on the facts from cell 9.","11":"List every possible world (DAG) the PDAG stands for.","12":"Make a blank figure.","13":"Draw it, with the number of possible worlds in the title.","16":"Pick one proven arrow (a \u2192 b) and one dashed edge (c \u2013 d) to test claims on.","17":"Four claims: the proven arrow, both directions of the dashed edge, and an indirect claim.","18":"support = share of possible worlds where the claim holds. 1.00 means proven."},"summary":"Stage 2 demo: draw the PDAG for the teaching premise and compute support for a few claims."}],"features":[{"id":"nb:16","title":"Notebook cell 16","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["t0 = time.time()","features = {name: build_feature_table(df.input) for name, df in data.items()}","print(f\"Built features for {sum(map(len, features.values())):,} rows in {time.time() - t0:.1f}s\")","features[\"test\"][[\"relation\", \"x\", \"y\"] + TEXT_FACT_FEATURES[:4] + [\"edge_x_to_y\", \"support\"]].head(6)"],"notes":{"0":"Start a stopwatch.","1":"For each dataset, build the feature table (premises are cached, so this takes ~11 s for 212k rows).","2":"Report how many rows and how long it took.","3":"Peek at a few columns of the first six test rows."},"summary":"Stage 3: turn every row of every dataset into a row of numbers (features)."},{"id":"py:features.build_feature_table","title":"build_feature_table()","where":"src/causal_nlp/features.py","start":77,"lines":["def build_feature_table(inputs: pd.Series, hypothesis_parser=parse_hypothesis) -> pd.DataFrame:","    \"\"\"One row of features per Corr2Cause input. Unparseable hypotheses get parsed=0.\"\"\"","    rows = []","    for text in inputs:","        premise_text, hyp_text = split_input(text)","        premise, pdag, definite, possible, dags = analyse_premise(premise_text)","        hyp = hypothesis_parser(hyp_text)","        if hyp is None:","            rows.append({\"parsed\": 0})","            continue","        rows.append({\"parsed\": 1, \"relation\": hyp.relation, \"x\": hyp.x, \"y\": hyp.y,","                     **pair_features(premise, pdag, definite, possible, dags, hyp)})","    return pd.DataFrame(rows, index=inputs.index)"],"notes":{"2":"Collect one dictionary per input row.","3":"For each raw input string:","4":"cut it into premise and hypothesis,","5":"stages 1-2 for the premise (cached: done once per premise),","6":"stage 1 for the hypothesis. The parser is a parameter, so Phase 2 can pass DistilBERT here.","7":"Unreadable hypothesis:","8":"mark it parsed=0 with no features (it will be predicted 'not valid').","10":"Otherwise store the relation, x, y and all pair features.","12":"Turn the list into a table aligned with the input rows."},"summary":"Make one row of numbers for every input row."},{"id":"py:features.analyse_premise","title":"analyse_premise","where":"src/causal_nlp/features.py","start":34,"lines":["@lru_cache(maxsize=None)","def analyse_premise(premise_text: str) -> tuple[Premise, PDAG, nx.DiGraph, nx.DiGraph, list[nx.DiGraph]]:","    \"\"\"Parse once per premise (many hypotheses share it) and build helper graphs.\"\"\"","    premise = parse_premise(premise_text)","    pdag = pc_from_premise(premise)","    definite = nx.DiGraph(list(pdag.directed))","    definite.add_nodes_from(pdag.nodes)","    possible = definite.copy()","    for edge in pdag.undirected:","        a, b = tuple(edge)","        possible.add_edges_from([(a, b), (b, a)])","    return premise, pdag, definite, possible, equivalent_dags(pdag)"],"notes":{"3":"Stage 1: sentences \u2192 facts.","4":"Stage 2: facts \u2192 PDAG.","5":"Graph of proven arrows only (for 'definite ancestor' checks).","7":"Graph where dashed edges count in both directions (for 'possible ancestor' checks).","10":"Add both directions of each dashed edge.","11":"Also list the possible worlds."},"summary":"Everything about one premise, computed once and remembered (cached)."},{"id":"py:features.pair_features","title":"pair_features()","where":"src/causal_nlp/features.py","start":48,"lines":["def pair_features(premise: Premise, pdag: PDAG, definite: nx.DiGraph,","                  possible: nx.DiGraph, dags: list[nx.DiGraph], hyp: Hypothesis) -> dict:","    x, y = hyp.x, hyp.y","    sepsets = premise.sepsets[frozenset((x, y))]","    feats = {f\"rel_{r}\": int(hyp.relation == r) for r in RELATIONS}","    feats.update({","        \"n_vars\": len(premise.variables),","        \"marginally_correlated\": int(frozenset((x, y)) in premise.correlated),","        \"adjacent\": int(pdag.adjacent(x, y)),","        \"n_sepsets\": len(sepsets),","        \"min_sepset_size\": min((len(s) for s in sepsets), default=-1),","        \"degree_x\": len(pdag.neighbours(x)),","        \"degree_y\": len(pdag.neighbours(y)),","        \"n_common_neighbours\": len(pdag.neighbours(x) & pdag.neighbours(y)),","        \"edge_x_to_y\": int((x, y) in pdag.directed),","        \"edge_y_to_x\": int((y, x) in pdag.directed),","        \"edge_undirected\": int(frozenset((x, y)) in pdag.undirected),","        \"x_ancestor_of_y\": int(nx.has_path(definite, x, y)),","        \"y_ancestor_of_x\": int(nx.has_path(definite, y, x)),","        \"x_possible_ancestor_of_y\": int(nx.has_path(possible, x, y)),","        \"y_possible_ancestor_of_x\": int(nx.has_path(possible, y, x)),","        \"n_common_children\": len(pdag.children(x) & pdag.children(y)),","        \"n_common_parents\": len(pdag.parents(x) & pdag.parents(y)),","        \"support\": support(dags, hyp.relation, x, y),","        \"n_equivalent_dags\": len(dags),","    })","    return feats"],"notes":{"2":"The two variables the claim is about.","3":"Their separating sets.","4":"One-hot relation: four 0/1 columns, exactly one is 1.","6":"Text facts start here: number of variables,","7":"does the text say X correlates with Y,","8":"are they joined in the skeleton,","9":"how many separating sets,","10":"smallest separating set (-1 if none),","11":"how many neighbours X and Y have,","13":"and how many neighbours they share.","14":"PC graph features: proven arrow X \u2192 Y, Y \u2192 X, or dashed edge,","17":"proven arrow path X \u21d2 Y or Y \u21d2 X,","19":"path if dashed edges may point either way,","21":"shared proven effects and shared proven causes.","23":"Support: share of possible worlds where the claim holds.","24":"Number of possible worlds."},"summary":"The feature numbers for one claim about the pair (x, y)."}],"tree":[{"id":"nb:20","title":"Notebook cell 20","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["def predict(model, feats, cols):","    # Rows whose hypothesis could not be parsed get \"not valid\" (the extractor found no triple).","    pred = np.zeros(len(feats), dtype=int)","    ok = (feats.parsed == 1).values","    if ok.any():","        pred[ok] = model.predict(feats.loc[ok, cols])","    return pred","","feature_groups = {","    \"relation + text facts\": RELATION_FEATURES + TEXT_FACT_FEATURES,","    \"+ PC graph\": RELATION_FEATURES + TEXT_FACT_FEATURES + PC_GRAPH_FEATURES,","    \"+ support (all)\": ALL_FEATURES,","}","model_makers = {","    \"Logistic Regression\": lambda: make_pipeline(StandardScaler(), LogisticRegression(max_iter=3000)),","    \"Decision Tree (depth 4)\": lambda: DecisionTreeClassifier(max_depth=4, random_state=SEED),","    \"Random Forest\": lambda: RandomForestClassifier(n_estimators=300, min_samples_leaf=2, n_jobs=-1, random_state=SEED),","}","rows, trained = [], {}","y_train = data[\"train\"].label","for group, cols in feature_groups.items():","    for name, make in model_makers.items():","        model = make().fit(features[\"train\"][cols], y_train)","        trained[(group, name)] = model","        row = {\"features\": group, \"model\": name}","        row.update({s: f1_score(data[s].label, predict(model, features[s], cols)) for s in [\"dev\", \"test\", \"refactorization\"]})","        rows.append(row)","ablation = pd.DataFrame(rows)","print(\"F1 of the valid class\")","ablation.round(3)"],"notes":{"0":"Helper: predict for rows the reader understood; rows it could not read get 0 (not valid).","2":"Start with all zeros.","3":"Mask of rows whose hypothesis was parsed.","5":"Fill in model predictions for those rows only.","8":"Three feature sets, each adding one reasoning step:","9":"only what the sentences say,","10":"plus what the PC graph shows,","11":"plus the possible-worlds support score.","13":"Three model types, created fresh for each feature set:","14":"scaled features \u2192 linear model,","15":"a flowchart at most 4 questions deep,","16":"300 trees voting.","18":"Collect result rows and keep every trained model.","19":"Training labels.","20":"Loop over feature sets\u2026","21":"\u2026and model types (9 combinations).","22":"Train on the training features.","23":"Remember the model.","25":"Score F1 on dev, test and refactorization.","27":"The ablation table: about 0.5 \u2192 0.93 \u2192 1.0 as reasoning is added."},"summary":"Stage 4: train 3 models \u00d7 3 feature groups (the ablation) and score each."},{"id":"nb:22","title":"Notebook cell 22","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["final_cols = ALL_FEATURES","final_model = trained[(\"+ support (all)\", \"Decision Tree (depth 4)\")]","print(export_text(final_model, feature_names=final_cols, decimals=2))"],"notes":{"0":"The final model uses every feature.","1":"Reuse the depth-4 decision tree already trained in cell 20.","2":"Print the whole tree as indented if/else rules."},"summary":"Pick the final model (depth-4 tree on all features) and print its rules."},{"id":"nb:25","title":"Notebook cell 25","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["test_feats = features[\"test\"]","test_pred = predict(final_model, test_feats, final_cols)","per_relation = pd.DataFrame({rel: scores(data[\"test\"].label[test_feats.relation == rel], test_pred[(test_feats.relation == rel).values])","                             for rel in RELATIONS}).T","per_relation[\"n valid\"] = [int(data[\"test\"].label[test_feats.relation == r].sum()) for r in RELATIONS]","display(per_relation.round(3))","ConfusionMatrixDisplay.from_predictions(data[\"test\"].label, test_pred, display_labels=[\"not valid\", \"valid\"],","                                        cmap=\"Blues\", colorbar=False)","plt.title(\"Decision tree \u2014 test set\"); plt.show()"],"notes":{"0":"Test-set features.","1":"Final predictions on test.","2":"Score each relation type (direct, indirect, collider, confounder) separately.","4":"How many truly valid claims of each type exist in test.","5":"Show the table.","6":"2\u00d72 grid: true vs predicted (valid / not valid).","8":"Title and show."},"summary":"Final model on the test set: scores per relation type and a confusion matrix."}],"graph":[{"id":"nb:29","title":"Notebook cell 29","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["test = data[\"test\"]","triples = pd.DataFrame({","    \"premise_id\": test.premise_id, \"relation\": test_feats.relation, \"x\": test_feats.x, \"y\": test_feats.y,","    \"label\": test.label, \"prob\": final_model.predict_proba(test_feats[final_cols])[:, 1],","})","premise_info = {pid: analyse_premise(p)[0] for pid, p in test.groupby(\"premise_id\").premise.first().items()}","nodes = {pid: f.variables for pid, f in premise_info.items()}","","predicted_dags = gs.dags_from_triples(triples, nodes)","edge_scores = gs.edge_metrics(predicted_dags, triples)","pd.Series(edge_scores).round(3).to_frame(\"predicted DAGs vs gold edges\")"],"notes":{"0":"Shortcut to the test table.","1":"One row per claim: premise id, relation, x, y, gold label, and the tree's P(valid).","3":"predict_proba gives [P(not valid), P(valid)]; [:, 1] keeps P(valid).","5":"For each test premise, its parsed facts (cached from stage 1).","6":"Each premise's list of variables.","8":"Build a DAG per premise from 'direct' claims with P(valid) \u2265 0.5.","9":"Compare predicted arrows with the gold arrows: precision, recall, F1.","10":"Show the edge scores."},"summary":"Stage 5 start: collect the test predictions as triples, build one DAG per premise, score edges."},{"id":"py:graph_stage.dags_from_triples","title":"dags_from_triples()","where":"src/causal_nlp/graph_stage.py","start":39,"lines":["def dags_from_triples(triples: pd.DataFrame, nodes_by_premise: dict, threshold: float = 0.5) -> dict:","    \"\"\"premise_id -> DAG built from the 'direct' triples predicted as valid.\"\"\"","    direct = triples[(triples.relation == DIRECT) & (triples.prob >= threshold)]","    dags = {}","    for pid, nodes in nodes_by_premise.items():","        rows = direct[direct.premise_id == pid]","        dags[pid], _ = build_dag(nodes, list(zip(rows.x, rows.y, rows.prob)))","    return dags"],"notes":{"2":"Keep claims of type 'direct' with P(valid) \u2265 threshold (0.5): the 'reviewed' predictions.","4":"For each premise \u2026","5":"\u2026 its accepted arrows \u2026","6":"\u2026 become a DAG (loops refused)."},"summary":"Build one DAG per premise from the accepted 'direct' claims."},{"id":"py:graph_stage.build_dag","title":"build_dag()","where":"src/causal_nlp/graph_stage.py","start":26,"lines":["def build_dag(nodes: list[str], scored_edges: list[tuple[str, str, float]]) -> tuple[nx.DiGraph, list]:","    \"\"\"Add edges from most to least confident; skip any edge that would close a cycle.","    Returns the DAG and the rejected edges (so the notebook can show them).\"\"\"","    dag, rejected = nx.DiGraph(), []","    dag.add_nodes_from(nodes)","    for cause, effect, score in sorted(scored_edges, key=lambda e: -e[2]):","        if cause == effect or nx.has_path(dag, effect, cause):  # self loop or cycle","            rejected.append((cause, effect, score))","        else:","            dag.add_edge(cause, effect, weight=score)","    return dag, rejected"],"notes":{"3":"Empty graph and an empty list of refused arrows.","4":"Every variable appears, even with no arrows.","5":"Highest confidence first, so a weak arrow can never block a strong one.","6":"Self-loop, or effect already leads back to cause (adding it would close a loop)?","7":"Then refuse it.","9":"Otherwise add the arrow, remembering its confidence."},"summary":"Add arrows from most to least confident, refusing any that would create a loop."},{"id":"nb:31","title":"Notebook cell 31","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["candidates = [(\"A\", \"B\", 0.95), (\"B\", \"C\", 0.90), (\"C\", \"A\", 0.40), (\"B\", \"B\", 0.30)]","dag, rejected = gs.build_dag([\"A\", \"B\", \"C\"], candidates)","print(\"kept    :\", list(dag.edges))","print(\"rejected:\", [(c, e) for c, e, _ in rejected], \"(cycle C\u2192A\u2192B\u2192C, self-loop B\u2192B)\")"],"notes":{"0":"Four candidate arrows with confidences; C \u2192 A would close a loop, B \u2192 B is a self-loop.","1":"Add arrows from most to least confident, skipping any that would make a loop.","2":"Arrows that made it into the DAG.","3":"Arrows refused, and why."},"summary":"Show the cycle check working on a deliberately bad set of candidate arrows."},{"id":"py:graph_stage.edge_metrics","title":"edge_metrics()","where":"src/causal_nlp/graph_stage.py","start":49,"lines":["def edge_metrics(dags: dict, triples: pd.DataFrame) -> dict:","    \"\"\"Micro-averaged edge precision / recall / F1 against the gold direct-cause edges.\"\"\"","    gold = triples[(triples.relation == DIRECT) & (triples.label == 1)]","    gold_edges = set(zip(gold.premise_id, gold.x, gold.y))","    pred_edges = {(pid, a, b) for pid, dag in dags.items() for a, b in dag.edges}","    tp = len(pred_edges & gold_edges)","    precision = tp / len(pred_edges) if pred_edges else 0.0","    recall = tp / len(gold_edges) if gold_edges else 0.0","    f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0","    return {\"gold_edges\": len(gold_edges), \"predicted_edges\": len(pred_edges), \"correct\": tp,","            \"edge_precision\": precision, \"edge_recall\": recall, \"edge_f1\": f1}"],"notes":{"2":"Gold arrows: 'direct' claims whose true label is 1.","4":"Every arrow in every predicted DAG.","5":"Arrows that are both predicted and gold (true positives).","6":"Share of predicted arrows that are right.","7":"Share of gold arrows we found.","8":"Harmonic mean of the two."},"summary":"Compare predicted arrows with gold arrows across all premises."},{"id":"py:graph_stage.noisy_or_network","title":"noisy_or_network()","where":"src/causal_nlp/graph_stage.py","start":63,"lines":["def noisy_or_network(dag: nx.DiGraph, base: float = BASE_RATE, strength: float = CAUSE_STRENGTH) -> DiscreteBayesianNetwork:","    \"\"\"Binary BN where each active cause independently switches its effect on.","    P(child=1 | k active parents) = 1 - (1 - base) * (1 - strength) ** k\"\"\"","    bn = DiscreteBayesianNetwork(list(dag.edges))","    bn.add_nodes_from(dag.nodes)","    for node in dag.nodes:","        parents = sorted(dag.predecessors(node))","        p_on = [1 - (1 - base) * (1 - strength) ** sum(states)","                for states in product((0, 1), repeat=len(parents))]","        bn.add_cpds(TabularCPD(node, 2, [[1 - p for p in p_on], p_on],","                               evidence=parents or None, evidence_card=[2] * len(parents) or None))","    bn.check_model()","    return bn"],"notes":{"3":"pgmpy network with the same arrows.","4":"Include variables with no arrows.","5":"For each variable, build its probability table:","6":"its direct causes,","7":"P(on) for every on/off combination of causes: 10% by itself, each active cause switches it on with 70% chance.","9":"Store the table: row 0 = P(off), row 1 = P(on).","11":"pgmpy checks every table sums to 1 and matches the arrows."},"summary":"Give the DAG simple probabilities so it becomes a Bayesian network."},{"id":"py:graph_stage.interventional_effect","title":"interventional_effect()","where":"src/causal_nlp/graph_stage.py","start":78,"lines":["def interventional_effect(bn: DiscreteBayesianNetwork, x: str, y: str) -> float:","    \"\"\"Average causal effect  P(Y=1 | do(X=1)) - P(Y=1 | do(X=0)).","    Intervening on X can only change X's descendants, so other variables get 0.\"\"\"","    if not nx.has_path(bn, x, y):","        return 0.0","    ci = CausalInference(bn)","    p = [ci.query([y], do={x: v}, show_progress=False).values[1] for v in (0, 1)]","    return float(p[1] - p[0])"],"notes":{"3":"No arrow path from X to Y \u2192 forcing X cannot touch Y \u2192 effect 0.","5":"pgmpy's do-calculus engine.","6":"P(Y=1 | do(X=0)) and P(Y=1 | do(X=1)): cut X off from its causes and set it.","7":"The average causal effect (ACE)."},"summary":"What-if: how much does forcing X on (vs off) change the chance Y is on?"},{"id":"py:graph_stage.observational_effect","title":"observational_effect()","where":"src/causal_nlp/graph_stage.py","start":88,"lines":["def observational_effect(bn: DiscreteBayesianNetwork, x: str, y: str) -> float:","    \"\"\"Plain association  P(Y=1 | X=1) - P(Y=1 | X=0)  (what correlation alone tells you).\"\"\"","    ve = VariableElimination(bn)","    p = [ve.query([y], evidence={x: v}, show_progress=False).values[1] for v in (0, 1)]","    return float(p[1] - p[0])"],"notes":{"2":"Ordinary probability inference.","3":"P(Y=1 | X=0) and P(Y=1 | X=1): condition on what we saw.","4":"Difference. Larger than the ACE when X and Y share a cause."},"summary":"Just looking: how much does SEEING X on (vs off) change the chance Y is on?"},{"id":"nb:34","title":"Notebook cell 34","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["correlated = {pid: (f.variables, f.correlated) for pid, f in premise_info.items()}","queries = gs.known_intervention_queries(triples, correlated)","answered = gs.answer_queries(queries, predicted_dags)","answered[\"correct\"] = answered.gold_effect == answered.predicted_effect","query_accuracy = answered.correct.mean()","print(f\"{len(answered)} known queries over {answered.premise_id.nunique()} premises \u2014 accuracy {query_accuracy:.3f}\")","answered.groupby(\"gold_effect\").correct.agg([\"size\", \"mean\"]).rename(columns={\"size\": \"queries\", \"mean\": \"accuracy\"})"],"notes":{"0":"For each premise: its variables and correlated pairs (needed to build 'no effect' questions).","1":"Questions 'does forcing X change Y?' whose true answer we know from labels and text.","2":"Answer each one with a noisy-OR Bayesian network on the predicted DAG.","3":"Did the network's yes/no match the known answer?","4":"Share answered correctly (0.975).","5":"Report the count and accuracy.","6":"Accuracy split by true answer: 'no' questions are all right; misses are 'yes' questions."},"summary":"Ask every 'known' what-if question with the Bayesian network and measure accuracy."},{"id":"py:graph_stage.known_intervention_queries","title":"known_intervention_queries()","where":"src/causal_nlp/graph_stage.py","start":96,"lines":["def known_intervention_queries(triples: pd.DataFrame, correlated_by_premise: dict) -> pd.DataFrame:","    \"\"\"Queries 'does do(X) change Y?' whose answer is fixed by the gold labels / text:","      yes - X directly or indirectly causes Y (gold label 1)","      no  - Y causes X (an effect cannot cause its cause in a DAG), or","            X and Y are not even correlated (no association -> no causal effect).\"\"\"","    causes = triples[triples.relation.isin([DIRECT, INDIRECT]) & (triples.label == 1)]","    yes = set(zip(causes.premise_id, causes.x, causes.y))","    rows = [{\"premise_id\": p, \"x\": x, \"y\": y, \"gold_effect\": True} for p, x, y in sorted(yes)]","    for pid, (nodes, correlated) in correlated_by_premise.items():","        for x, y in product(nodes, nodes):","            if x == y or (pid, x, y) in yes:","                continue","            if (pid, y, x) in yes or frozenset((x, y)) not in correlated:","                rows.append({\"premise_id\": pid, \"x\": x, \"y\": y, \"gold_effect\": False})","    return pd.DataFrame(rows)"],"notes":{"5":"Claims 'X directly or indirectly causes Y' that are labelled valid.","6":"Those pairs: forcing X definitely changes Y.","7":"Record each as a 'yes' question.","9":"Then check every other ordered pair:","12":"If Y causes X (effects cannot cause their causes) or they are not even correlated,","13":"the true answer is 'no effect'."},"summary":"Build the what-if questions whose true answer we know."},{"id":"py:graph_stage.answer_queries","title":"answer_queries()","where":"src/causal_nlp/graph_stage.py","start":113,"lines":["def answer_queries(queries: pd.DataFrame, dags: dict) -> pd.DataFrame:","    \"\"\"Build a noisy-OR BN on each predicted DAG and answer every query with do-calculus.\"\"\"","    networks = {pid: noisy_or_network(dag) for pid, dag in dags.items()}","    effects = [interventional_effect(networks[p], x, y) for p, x, y in zip(queries.premise_id, queries.x, queries.y)]","    return queries.assign(effect=effects, predicted_effect=[e > EFFECT_THRESHOLD for e in effects])"],"notes":{"2":"One network per premise.","3":"Compute the ACE for each question.","4":"Say 'yes, it changes Y' if the ACE is above 0.01."},"summary":"Answer every question with the Bayesian network."},{"id":"nb:37","title":"Notebook cell 37","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["best = None","for pid, dag in predicted_dags.items():","    bn = gs.noisy_or_network(dag)","    for x, y in dag.edges:","        if set(dag.predecessors(x)) & set(dag.predecessors(y)):  # X and Y share a parent","            gap = gs.observational_effect(bn, x, y) - gs.interventional_effect(bn, x, y)","            if best is None or gap > best[0]:","                best = (gap, pid, x, y, bn)","gap, pid, x, y, bn = best","z = sorted(set(predicted_dags[pid].predecessors(x)) & set(predicted_dags[pid].predecessors(y)))","print(f\"Premise {pid}: {x} \u2192 {y}, common cause(s) {z}\")","print(f\"  observational  P({y}=1|{x}=1) - P({y}=1|{x}=0)         = {gs.observational_effect(bn, x, y):.3f}\")","print(f\"  interventional P({y}=1|do({x}=1)) - P({y}=1|do({x}=0)) = {gs.interventional_effect(bn, x, y):.3f}\")"],"notes":{"0":"Will hold the example with the biggest gap.","1":"Look at every premise's DAG\u2026","2":"\u2026turn it into a Bayesian network\u2026","3":"\u2026and check every arrow X \u2192 Y.","4":"Only pairs with a shared cause (a confounder), where seeing \u2260 forcing.","5":"Gap = (effect of seeing X) \u2212 (effect of forcing X).","6":"Keep the biggest gap so far.","8":"Unpack the winner.","9":"The shared causes, for printing.","11":"Seeing: P(Y=1 | X=1) \u2212 P(Y=1 | X=0). Includes the confounder's influence.","12":"Forcing: P(Y=1 | do(X=1)) \u2212 P(Y=1 | do(X=0)). Only X's own effect."},"summary":"Find the clearest example where seeing X and forcing X give different answers."},{"id":"nb:39","title":"Notebook cell 39","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["from pgmpy.models import DiscreteBayesianNetwork","samples = bn.simulate(5000, seed=SEED, show_progress=False)","fitted = DiscreteBayesianNetwork(list(predicted_dags[pid].edges))","fitted.add_nodes_from(predicted_dags[pid].nodes)","fitted.fit(samples)","print(f\"ACE of {x} on {y}: reference {gs.interventional_effect(bn, x, y):.3f} | fitted from samples {gs.interventional_effect(fitted, x, y):.3f}\")"],"notes":{"0":"pgmpy's Bayesian network class.","1":"Draw 5,000 rows of fake 0/1 data from the reference network (Corr2Cause has no real measurements).","2":"A fresh network with the predicted structure but no numbers yet.","3":"Include variables that have no arrows.","4":"Learn every probability table by counting in the data (maximum likelihood).","5":"The learned network gives nearly the same causal effect as the reference (0.51 vs 0.49)."},"summary":"Show that pgmpy can LEARN the probabilities from data, using simulated samples."}]},"notebook":[{"cell":0,"kind":"markdown","heading":"Phase 1 \u2014 Neuro-Symbolic Causal Inference: the ML pipeline","source":"# Phase 1 \u2014 Neuro-Symbolic Causal Inference: the ML pipeline\n\n**Goal.** Read a short text that lists statistical facts about some variables, decide which\n*causal* claims about them are valid, assemble the valid cause\u2192effect claims into a DAG,\nand answer intervention (\"what if we force X?\") questions with a Bayesian network.\n\n**Dataset.** [Corr2Cause](https://huggingface.co/datasets/causal-nlp/corr2cause) (Jin et al., ICLR 2024).\nEach example is a *premise* (all correlations / independences in a closed system) and a\n*hypothesis* (one causal claim). Label 1 = the claim must be true; 0 = it is not implied.\n\n```\n            (1) rule-based         (2) PC algorithm        (3) features      (4) classifier\n  TEXT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25b6 FACTS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25b6 PDAG \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25b6 X \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25b6 valid causal triples\n                                                                                                \u2502\n                                                                (5) graph stage: DAG \u2500\u25b6 Bayesian network \u2500\u25b6 do-queries\n```\n\n* **Language layer (1)** \u2014 turns sentences into facts. Phase 1: regular expressions.\n  *Phase 2 swaps in DistilBERT here.*\n* **Reasoning layer (2\u20134)** \u2014 causal-discovery rules + an interpretable classifier.\n* **Graph layer (5)** \u2014 shared by both phases, so the ML vs DL comparison is fair."},{"cell":1,"kind":"code","heading":"Phase 1 \u2014 Neuro-Symbolic Causal Inference: the ML pipeline","source":"import sys, time, warnings\nfrom pathlib import Path\nwarnings.filterwarnings(\"ignore\")\nROOT = Path.cwd().parent if Path.cwd().name == \"notebooks\" else Path.cwd()\nsys.path.insert(0, str(ROOT / \"src\"))\n\nimport numpy as np, pandas as pd, networkx as nx, matplotlib.pyplot as plt\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.tree import DecisionTreeClassifier, export_text\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import precision_score, recall_score, f1_score, accuracy_score, ConfusionMatrixDisplay\n\nfrom causal_nlp.data import load_split, load_refactorization_test, load_paraphrase_test\nfrom causal_nlp.parsing import parse_premise, parse_hypothesis, RELATIONS\nfrom causal_nlp.causal_rules import pc_from_premise, equivalent_dags, support\nfrom causal_nlp.features import (build_feature_table, analyse_premise, RELATION_FEATURES,\n                                 TEXT_FACT_FEATURES, PC_GRAPH_FEATURES, SUPPORT_FEATURES, ALL_FEATURES)\nfrom causal_nlp import graph_stage as gs\n\nSEED = 42\nRESULTS = ROOT / \"results\"; RESULTS.mkdir(exist_ok=True)\npd.set_option(\"display.max_colwidth\", 200)\nplt.rcParams.update({\"figure.dpi\": 110, \"axes.spines.top\": False, \"axes.spines.right\": False})","snippet":{"id":"nb:1","title":"Notebook cell 1","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["import sys, time, warnings","from pathlib import Path","warnings.filterwarnings(\"ignore\")","ROOT = Path.cwd().parent if Path.cwd().name == \"notebooks\" else Path.cwd()","sys.path.insert(0, str(ROOT / \"src\"))","","import numpy as np, pandas as pd, networkx as nx, matplotlib.pyplot as plt","from sklearn.feature_extraction.text import TfidfVectorizer","from sklearn.compose import ColumnTransformer","from sklearn.pipeline import make_pipeline","from sklearn.linear_model import LogisticRegression","from sklearn.preprocessing import StandardScaler","from sklearn.tree import DecisionTreeClassifier, export_text","from sklearn.ensemble import RandomForestClassifier","from sklearn.metrics import precision_score, recall_score, f1_score, accuracy_score, ConfusionMatrixDisplay","","from causal_nlp.data import load_split, load_refactorization_test, load_paraphrase_test","from causal_nlp.parsing import parse_premise, parse_hypothesis, RELATIONS","from causal_nlp.causal_rules import pc_from_premise, equivalent_dags, support","from causal_nlp.features import (build_feature_table, analyse_premise, RELATION_FEATURES,","                                 TEXT_FACT_FEATURES, PC_GRAPH_FEATURES, SUPPORT_FEATURES, ALL_FEATURES)","from causal_nlp import graph_stage as gs","","SEED = 42","RESULTS = ROOT / \"results\"; RESULTS.mkdir(exist_ok=True)","pd.set_option(\"display.max_colwidth\", 200)","plt.rcParams.update({\"figure.dpi\": 110, \"axes.spines.top\": False, \"axes.spines.right\": False})"],"notes":{"0":"Built-in helpers: sys (Python's settings), time (stopwatch), warnings (to silence noisy messages).","1":"Path = a handy object for file and folder paths.","2":"Hide library warnings so the output stays readable.","3":"Find the project folder, whether the notebook is started from /notebooks or from the project root.","4":"Let Python import our own package from src/causal_nlp.","6":"numpy = fast arrays, pandas = tables, networkx = graphs, matplotlib = plots.","7":"Turns text into word-frequency numbers (used by the text-only baseline).","8":"Applies a different transformer to different table columns (premise vs hypothesis).","9":"Chains steps (transform \u2192 model) into one object with .fit and .predict.","10":"A linear classifier: weighted sum of features \u2192 probability.","11":"Rescales each feature to mean 0, spread 1 (helps logistic regression).","12":"Flowchart-style classifier; export_text prints its rules.","13":"Many decision trees voting together.","14":"Scoring functions: precision, recall, F1, accuracy, and a confusion-matrix plot.","16":"Our loaders for the dataset and its two robustness test sets.","17":"Stage 1: the regex reader.","18":"Stage 2: the PC algorithm, possible worlds and support.","19":"Stage 3: builds the feature table and the lists of feature names per group.","21":"Stage 5: DAG building, Bayesian network and what-if queries.","23":"Fixed random seed so every run gives the same models and numbers.","24":"Folder where results are saved for the Phase 2 comparison.","25":"Show longer text in table cells.","26":"Plot style: sharper figures, no top/right box lines."},"summary":"Setup: tell Python where our code lives and load every library the notebook uses."}},{"cell":2,"kind":"markdown","heading":"1. Data","source":"## 1. Data\n\nWe use the official train / dev / test split. The test set is small (21 premises, 1,162 hypotheses)\nbut every premise comes with *all* its hypotheses, which is exactly what the graph stage needs.\n\nTwo extra **robustness test sets** from the same authors ask the same questions with\n(a) variables renamed (`A,B,C \u2192 Z,Y,X`) and (b) hypotheses re-worded (`directly causes \u2192 directly affects`).\n\n**Labels.** The original generator had a bug that wrote 6,943 wrong labels (3.3 %).\nWe use the [corrected labels](https://huggingface.co/datasets/zluke/corr2cause-corrected)\n(identical text, labels fixed). Section 4 also reports scores on the original labels."},{"cell":3,"kind":"code","heading":"1. Data","source":"data = {\n    \"train\": load_split(\"train\"),\n    \"dev\": load_split(\"dev\"),\n    \"test\": load_split(\"test\"),\n    \"refactorization\": load_refactorization_test(),\n    \"paraphrase\": load_paraphrase_test(),\n}\npd.DataFrame({name: {\"rows\": len(df), \"premises\": df.premise.nunique(),\n                     \"% valid\": round(100 * df.label.mean(), 1)} for name, df in data.items()}).T","snippet":{"id":"nb:3","title":"Notebook cell 3","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["data = {","    \"train\": load_split(\"train\"),","    \"dev\": load_split(\"dev\"),","    \"test\": load_split(\"test\"),","    \"refactorization\": load_refactorization_test(),","    \"paraphrase\": load_paraphrase_test(),","}","pd.DataFrame({name: {\"rows\": len(df), \"premises\": df.premise.nunique(),","                     \"% valid\": round(100 * df.label.mean(), 1)} for name, df in data.items()}).T"],"notes":{"0":"A dictionary: name \u2192 table. Each value is a pandas DataFrame, one row per (premise, hypothesis).","1":"205,734 training rows (with corrected labels).","2":"Small development set, used only as a second check.","3":"The held-out test set: 21 premises, 1,162 hypotheses. Headline numbers come from here.","4":"Same questions with variables renamed (A, B, C \u2192 Z, Y, X). Tests if a model relies on names.","5":"Same questions with hypotheses re-worded. Tests if a model relies on exact wording.","7":"Build a summary table: for each set, number of rows, number of distinct premises,","8":"and the percentage of claims that are valid (label 1). .T flips the table so each dataset is one row."},"summary":"Load all five datasets and print a size summary of each."}},{"cell":4,"kind":"markdown","heading":"1. Data","source":"**Leakage check.** Hypotheses about the same premise are near-duplicates, so splits must be\nseparated *by premise* (\"split documents before extraction\"). The official split already does this\nfor the test set (0 shared premises). Dev shares 2 of its 22 premises with train, so dev is only used as\na secondary check \u2014 all headline numbers are on test."},{"cell":5,"kind":"code","heading":"1. Data","source":"premise_sets = {name: set(data[name].premise) for name in (\"train\", \"dev\", \"test\")}\nprint(\"train \u2229 test premises:\", len(premise_sets[\"train\"] & premise_sets[\"test\"]))\nprint(\"train \u2229 dev  premises:\", len(premise_sets[\"train\"] & premise_sets[\"dev\"]))\nprint(\"Variables per premise in train:\", data[\"train\"].num_variables.value_counts().sort_index().to_dict())\nprint(\"Variables per premise in test: \", data[\"test\"].num_variables.value_counts().sort_index().to_dict())","snippet":{"id":"nb:5","title":"Notebook cell 5","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["premise_sets = {name: set(data[name].premise) for name in (\"train\", \"dev\", \"test\")}","print(\"train \u2229 test premises:\", len(premise_sets[\"train\"] & premise_sets[\"test\"]))","print(\"train \u2229 dev  premises:\", len(premise_sets[\"train\"] & premise_sets[\"dev\"]))","print(\"Variables per premise in train:\", data[\"train\"].num_variables.value_counts().sort_index().to_dict())","print(\"Variables per premise in test: \", data[\"test\"].num_variables.value_counts().sort_index().to_dict())"],"notes":{"0":"For train, dev, test: the set of distinct premise texts.","1":"\u2229 = overlap. 0 shared premises means the test is truly unseen.","2":"Dev shares 2 premises with train, which is why dev is only a secondary check.","3":"How many rows have 2, 3, 4, 5, 6 variables. Train is mostly 6-variable.","4":"Test covers 2 to 6 variables."},"summary":"Leakage check: make sure test premises never appear in training."}},{"cell":6,"kind":"code","heading":"1. Data","source":"example = data[\"test\"][data[\"test\"].num_variables == 3].iloc[[0, 3, 5]]\nfor _, row in example.iterrows():\n    print(f\"[label={row.label}] {row.hypothesis}\")\nprint(\"\\nPremise:\", example.premise.iloc[0])","snippet":{"id":"nb:6","title":"Notebook cell 6","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["example = data[\"test\"][data[\"test\"].num_variables == 3].iloc[[0, 3, 5]]","for _, row in example.iterrows():","    print(f\"[label={row.label}] {row.hypothesis}\")","print(\"\\nPremise:\", example.premise.iloc[0])"],"notes":{"0":"Pick test rows with 3 variables, then rows 0, 3 and 5 of those.","1":"Loop over the three chosen rows.","2":"Show each hypothesis with its gold label.","3":"Show the premise they all share."},"summary":"Print one small example premise with three of its hypotheses and labels."}},{"cell":7,"kind":"code","heading":"1. Data","source":"# How many labels the bug-fix changed per split\nfor split in (\"train\", \"dev\", \"test\"):\n    original = load_split(split, corrected=False)\n    print(f\"{split:5s}: {(original.label != data[split].label).sum():5d} labels changed\")","snippet":{"id":"nb:7","title":"Notebook cell 7","where":"notebooks/01_phase1_ml_pipeline.ipynb","start":1,"lines":["# How many labels the bug-fix changed per split","for split in (\"train\", \"dev\", \"test\"):","    original = load_split(split, corrected=False)","    print(f\"{split:5s}: {(original.label != data[split].label).sum():5d} labels changed\")"],"notes":{"1":"For each of the three official splits:","2":"load the ORIGINAL (buggy) labels,","3":"and count rows where original label \u2260 corrected label."},"summary":"Count how many labels the published bug-fix changed."}},{"cell":8,"kind":"markdown","heading":"2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)","source":"## 2. Stage 1 \u2014 Text \u2192 facts (rule-based extractor)\n\nOur small **entity schema**: variables are single capital letters; facts are\n`correlates(X, Y)` and `independent(X, Y | S)`; hypotheses are one of four relations:\n\n| relation | hypothesis wording | meaning |\n|---|---|---|\n| `direct` | *X directly causes Y* | X \u2192 Y |\n| `indirect` | *X causes something else which causes Y* / *X is a cause for Y, but not a direct one* | X \u2192 Z \u2192 \u2026 \u2192 Y |\n| `collider` | *There exists at least one collider (common effect) o
